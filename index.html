    <style>
        body {
            font-family: monospace;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        #output {
            background-color: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        #input {
            background-color: #0a0a0a;
            border: 1px solid #333;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 16px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        #input:focus {
            outline: none;
            border-color: #555;
        }
    </style>
</head>

        // ============================================================
        // DYNAMIC STATE MANAGER  — Section 5.2
        // Holds the current mutable game state. This is what gets saved.
        // ============================================================
        /* eslint-disable no-unused-vars */
        const Game = {
            version: "1.0.0",

            // --- Static data (read-only during gameplay) ----------
            data: DATA,

            // --- Dynamic game state (mutated during play) ---------
            state: null,

            /**
             * Initializes fresh dynamic state on a new game.
             * Called by the character builder after confirming the character.
             * @param {Object} player  The fully built player object
             */
            initState: function(player) {
                this.state = {
                    mode: "playing",

                    player: player,

                    clock: {
                        day: 1,
                        hour: 8,
                        minute: 0,
                        month: "Frostwane"
                    },

                    flags:   {},
                    variables: {},

                    world: {
                        itemLocations:   {},
                        npcStates:       {},
                        monsterStates:   {},
                        locationStates:  {}
                    }
                };
                return this.state;
            },

            /**
             * Returns true when dynamic state has been initialised.
             */
            hasState: function() {
                return this.state !== null && this.state !== undefined;
            },

            // --- State access helpers -----------------------------
            /**
             * @returns {Object|null} The clock object
             */
            getClock: function() {
                return this.state ? this.state.clock : null;
            },

            /**
             * @returns {Object|null} The flags object
             */
            getFlags: function() {
                return this.state ? this.state.flags : null;
            },

            /**
             * Get or set a single flag.
             * @param {string} key
             * @param {*} [value] — omit to read, pass to write
             * @returns {*}
             */
            flag: function(key, value) {
                if (!this.state) return;
                if (value === undefined) return this.state.flags[key];
                this.state.flags[key] = value;
            },

            /**
             * Get or set a single variable.
             * @param {string} key
             * @param {*} [value] — omit to read, pass to write
             * @returns {*}
             */
            variable: function(key, value) {
                if (!this.state) return;
                if (value === undefined) return this.state.variables[key];
                this.state.variables[key] = value;
            },

            /**
             * @returns {Object|null} The current player object
             */
            getPlayer: function() {
                return this.state ? this.state.player : null;
            },

            /**
             * Update the player reference (used after loading a save).
             * @param {Object} player
             */
            setPlayer: function(player) {
                if (this.state) this.state.player = player;
            },

            // --- World state helpers ------------------------------
            /**
             * Get the current location of an NPC or entity from world state
             * overrides, falling back to entity default.
             * @param {string} entityId
             * @returns {string|null}
             */
            getNpcLocation: function(entityId) {
                if (this.state && this.state.world.npcStates[entityId]?.location) {
                    return this.state.world.npcStates[entityId].location;
                }
                const npc = DATA.npcs.find(n => n.id === entityId);
                return npc ? npc.defaultLocation : null;
            },

            /**
             * Override an NPC's current location (set by the schedule system).
             * @param {string} entityId
             * @param {string} locationId
             */
            setNpcLocation: function(entityId, locationId) {
                if (!this.state) return;
                this.state.world.npcStates[entityId] = this.state.world.npcStates[entityId] || {};
                this.state.world.npcStates[entityId].location = locationId;
            },

            /**
             * Get the state of a location (door open/closed, looted, etc.).
             * @param {string} locationId
             * @returns {Object}
             */
            getLocationState: function(locationId) {
                if (!this.state) return {};
                return this.state.world.locationStates[locationId] || {};
            },

            /**
             * Set a property on a location's world state.
             * @param {string} locationId
             * @param {string} key
             * @param {*} value
             */
            setLocationState: function(locationId, key, value) {
                if (!this.state) return;
                this.state.world.locationStates[locationId] = this.state.world.locationStates[locationId] || {};
                this.state.world.locationStates[locationId][key] = value;
            },

            // --- Game mode ----------------------------------------
            /**
             * Set or read the current game mode.
             * @param {string} [mode]
             * @returns {string|void}
             */
            gameMode: function(mode) {
                if (!this.state) return;
                if (mode === undefined) return this.state.mode;
                this.state.mode = mode;
            }
        };
        /* eslint-enable no-unused-vars */
    </script>
</body>
</html>
