<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Text RPG Engine</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 20px;
    }
    #output {
      width: 100%;
      height: 400px;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    #input {
      width: 100%;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="output"></div>
  <input type="text" id="input" placeholder="Enter command...">

  <script>
    const GameModes = {
      TITLE: "title",
      CHARACTER_CREATION: "character_creation",
      PLAYING: "playing",
      GAME_OVER: "game_over"
    };

    const Game = {
      version: "1.0.0",

      data: {},
      state: {},

      ui: {},
      parser: {},
      engine: {},
      checks: {},
      inventory: {},
      characterCreation: {},
      clock: {},
      schedules: {},
      storage: {},
      conditions: {},
      combat: {},
      dialogue: {},
      utilities: {}
    };

    const STATE = {
      mode: GameModes.TITLE,

      player: {},
      clock: {
        day: 1,
        hour: 8,
        minute: 0,
        month: "Frostwane"
      },
      flags: {},
      variables: {},

      world: {
        itemLocations: {},
        npcOverrides: {},
        monsterStates: {},
        locationStates: {}
      }
    };

    Game.data = {};
    Game.state = STATE;
  </script>
</body>
</html>
