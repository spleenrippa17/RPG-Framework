<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      background-color: #0f0f1e;
      border-bottom: 2px solid #4a4a7a;
      padding: 12px 20px;
      text-align: center;
      color: #8be9fd;
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(139, 233, 253, 0.5);
    }

    #main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #output-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #16213e;
      border-right: 2px solid #4a4a7a;
    }

    #output-area::-webkit-scrollbar {
      width: 8px;
    }

    #output-area::-webkit-scrollbar-track {
      background: #0f0f1e;
    }

    #output-area::-webkit-scrollbar-thumb {
      background: #4a4a7a;
      border-radius: 4px;
    }

    #output-area::-webkit-scrollbar-thumb:hover {
      background: #6c6ca0;
    }

    .output-line {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .output-command {
      color: #50fa7b;
      font-weight: bold;
    }

    .output-narrative {
      color: #f8f8f2;
    }

    .output-system {
      color: #bd93f9;
      font-style: italic;
    }

    .output-error {
      color: #ff5555;
    }

    .output-highlight {
      color: #ffb86c;
    }

    /* TODO: Enable sidebar during PLAYING mode in a later phase */
    #sidebar {
      width: 280px;
      background-color: #0f0f1e;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    .sidebar-title {
      color: #ff79c6;
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #4a4a7a;
      padding-bottom: 5px;
    }

    .sidebar-content {
      color: #ccc;
      font-size: 0.9em;
      line-height: 1.6;
    }

    #input-area {
      background-color: #0f0f1e;
      border-top: 2px solid #4a4a7a;
      padding: 15px 20px;
      display: flex;
      align-items: center;
    }

    #prompt {
      color: #8be9fd;
      margin-right: 10px;
      font-weight: bold;
    }

    #command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8f8f2;
      font-family: inherit;
      font-size: 1em;
      caret-color: #50fa7b;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background-color: #50fa7b;
      animation: blink 1s infinite;
    }

    .separator {
      color: #4a4a7a;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="header">⚔ FANTASY ADVENTURE ⚔</div>
  
  <div id="main-container">
    <div id="output-area"></div>
    <div id="sidebar">
      <div class="sidebar-title">Status</div>
      <div class="sidebar-content" id="sidebar-content">
        No active session
      </div>
    </div>
  </div>
  
  <div id="input-area">
    <span id="prompt">&gt;</span>
    <input type="text" id="command-input" autocomplete="off" autofocus>
    <span class="cursor"></span>
  </div>

    Game.data.items = {
      iron_sword: { id: 'iron_sword', name: 'iron sword', weight: 3, slot: 'weapon', type: 'weapon', value: 20 },

      travel_rations: { id: 'travel_rations', name: 'travel rations', weight: 1, type: 'consumable', stackable: true, value: 1 },
      flint_and_steel: { id: 'flint_and_steel', name: 'flint and steel', weight: 1, type: 'tool', value: 2 },

      spell_pouch: { id: 'spell_pouch', name: 'spell pouch', weight: 1, type: 'tool', value: 10 },
      wooden_shield: { id: 'wooden_shield', name: 'wooden shield', weight: 6, slot: 'offhand', type: 'shield', shieldBonus: 1, value: 8 },
      holy_symbol: { id: 'holy_symbol', name: 'holy symbol', weight: 0, type: 'misc', value: 0 },
      rusty_dagger: { id: 'rusty_dagger', name: 'rusty dagger', weight: 1, slot: 'weapon', type: 'weapon', value: 2 },
      ragged_cloak: { id: 'ragged_cloak', name: 'ragged cloak', weight: 1, slot: 'cloak', type: 'clothing', value: 1 },
      lockpicks: { id: 'lockpicks', name: 'lockpicks', weight: 0, type: 'tool', value: 5 },
      fine_sword: { id: 'fine_sword', name: 'fine sword', weight: 3, slot: 'weapon', type: 'weapon', value: 40 },
      noble_clothes: { id: 'noble_clothes', name: 'noble clothes', weight: 3, slot: 'armor', type: 'clothing', value: 25 },
      signet_ring: { id: 'signet_ring', name: 'signet ring', weight: 0, slot: 'accessory1', type: 'misc', value: 15 },
      dark_cloak: { id: 'dark_cloak', name: 'dark cloak', weight: 2, slot: 'cloak', type: 'clothing', value: 5 },
      torch: { id: 'torch', name: 'torch', weight: 1, type: 'light', stackable: true, value: 1 },
      village_notice: { id: 'village_notice', name: 'notice board posting', weight: 0, type: 'misc', value: 0 }
    };

    Game.data.locations = {
      village_square: {
        id: 'village_square',
        name: 'Village Square',
        descriptions: [
          {
            text: 'You stand in the muddy square of a small frontier village. A stone well sits at the center, its rope darkened by years of use. Timber-framed buildings crowd the edges — the general store to the north, the Silver Stag tavern to the south, and the temple yard to the east. A notice board stands near the well, plastered with faded parchments.',
            conditions: []
          }
        ],
        exits: {
          north: { to: 'general_store', travelMinutes: 1 },
          south: { to: 'silver_stag_tavern', travelMinutes: 1 },
          east: { to: 'temple_yard', travelMinutes: 1 }
        },
        items: ['village_notice'],
        tags: ['settlement', 'outdoors']
      }
    };

    Game.ui.print = function(text, className = 'output-narrative') {
      const outputArea = document.getElementById('output-area');
      const div = document.createElement('div');
      div.className = `output-line ${className}`;
      div.textContent = text;
      outputArea.appendChild(div);
      outputArea.scrollTop = outputArea.scrollHeight;
    };

    Game.ui.clearOutput = function() {
      const outputArea = document.getElementById('output-area');
      outputArea.innerHTML = '';
      this.print('═══════════════════════════════════════', 'separator');
      this.print('Screen cleared.', 'output-system');
      this.print('═══════════════════════════════════════', 'separator');
    };

    Game.ui.echoCommand = function(command) {
      this.print(`> ${command}`, 'output-command');
    };

    Game.ui.showTitle = function() {
      this.print('', '');
      this.print('╔══════════════════════════════════════╗', 'separator');
      this.print('║                                      ║', 'separator');
      this.print('║     FANTASY TEXT ADVENTURE           ║', 'output-highlight');
      this.print('║     A Classic RPG Experience         ║', 'output-system');
      this.print('║                                      ║', 'separator');
      this.print('╠══════════════════════════════════════╣', 'separator');
      this.print('║                                      ║', 'separator');
      this.print('║   Type "start" to begin your quest   ║', 'output-narrative');
      this.print('║   Type "help" for available commands ║', 'output-narrative');
      this.print('║   Type "about" for game info         ║', 'output-narrative');
      this.print('║                                      ║', 'separator');
      this.print('╚══════════════════════════════════════╝', 'separator');
      this.print('', '');
    };

    Game.ui.handleInput = function(input) {
      if (!input.trim()) return;
      
      this.echoCommand(input);
      Game.state.commandHistory.push(input);
      Game.state.pendingQuit = false;
      
      const trimmed = input.trim().toLowerCase();
      
      switch (Game.state.mode) {
        case GameModes.TITLE:
          this.handleTitleInput(trimmed);
          break;
        case GameModes.CHARACTER_CREATION:
          Game.characterCreation.handleInput(trimmed);
          break;
        case GameModes.PLAYING:
          Game.engine.handleCommand(trimmed);
          break;
        case GameModes.GAME_OVER:
          this.handleGameOverInput(trimmed);
          break;
      }
    };

    Game.ui.handleTitleInput = function(input) {
      if (input === 'start' || input === 'begin' || input === 'play') {
        this.print('', '');
        this.print('Starting new adventure...', 'output-system');
        this.print('', '');
        
        Game.characterCreation.start();
        Game.state.mode = GameModes.CHARACTER_CREATION;
      } else if (input === 'help') {
        this.showHelp(Game.engine.availableCommands.title);
      } else if (input === 'clear') {
        this.clearOutput();
        setTimeout(() => this.showTitle(), 100);
      } else if (input === 'about') {
        this.showAbout();
      } else {
        this.print('Please type "start" to begin your adventure.', 'output-system');
      }
    };

    Game.ui.handleGameOverInput = function(input) {
      if (input === 'restart' || input === 'start' || input === 'new') {
        location.reload();
      } else if (input === 'quit' || input === 'exit') {
        this.print('Thank you for playing!', 'output-system');
        setTimeout(() => window.location.href = 'about:blank', 2000);
      } else {
        this.print('Type "restart" for a new game or "quit" to exit.', 'output-system');
      }
    };

    Game.ui.showHelp = function(commands) {
      this.print('', '');
      this.print('━━━━━━━━━━ AVAILABLE COMMANDS ━━━━━━━━━━', 'output-highlight');
      this.print('', '');
      
      if (commands) {
        commands.forEach(cmd => {
          this.print(`  ${cmd.name.padEnd(20)} - ${cmd.description}`, 'output-narrative');
        });
      }
      
      this.print('', '');
      this.print('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'output-highlight');
      this.print('', '');
    };

    Game.ui.showAbout = function() {
      this.print('', '');
      this.print('━━━━━━━━━━ ABOUT THIS GAME ━━━━━━━━━━━━', 'output-highlight');
      this.print('', '');
      this.print('Fantasy Text Adventure v' + Game.version, 'output-system');
      this.print('A classic text-based RPG engine', 'output-narrative');
      this.print('', '');
      this.print('Features:', 'output-highlight');
      this.print('  • Character creation with stats and skills', 'output-narrative');
      this.print('  • Inventory and equipment management', 'output-narrative');
      this.print('  • Turn-based time progression', 'output-narrative');
      this.print('  • NPCs, monsters, and combat', 'output-narrative');
      this.print('  • Save/load and export/import support', 'output-narrative');
      this.print('', '');
      this.print('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'output-highlight');
      this.print('', '');
    };

    Game.parser.normalize = function(input) {
      return input.toLowerCase().trim().replace(/\s+/g, ' ');
    };

    Game.engine.availableCommands = {
      title: [
        { name: 'start', description: 'Begin a new adventure' },
        { name: 'help', description: 'Show available commands' },
        { name: 'clear', description: 'Clear the screen' },
        { name: 'about', description: 'Display game information' }
      ],
      playing: [
        { name: 'look', description: 'Examine your surroundings' },
        { name: 'go [direction]', description: 'Travel to a new area' },
        { name: 'talk [npc]', description: 'Speak with an NPC' },
        { name: 'take [item]', description: 'Pick up an item' },
        { name: 'drop [item]', description: 'Drop an item from inventory' },
        { name: 'equip [item]', description: 'Equip an item' },
        { name: 'unequip [item]', description: 'Unequip an item' },
        { name: 'inventory', description: 'View your inventory' },
        { name: 'wait', description: 'Pass some time' },
        { name: 'save', description: 'Save your progress' },
        { name: 'load', description: 'Load a saved game' },
        { name: 'help', description: 'Show available commands' },
        { name: 'clear', description: 'Clear the screen' },
        { name: 'about', description: 'Display game information' }
      ]
    };

    Game.engine.handleCommand = function(input) {
      const normalized = Game.parser.normalize(input);
      
      if (normalized === 'help') {
        Game.ui.showHelp(this.availableCommands.playing);
      } else if (normalized === 'clear') {
        Game.ui.clearOutput();
      } else if (normalized === 'about') {
        Game.ui.showAbout();
      } else if (normalized === 'look' || normalized === 'l') {
        this.look();
      } else if (normalized === 'north' || normalized === 'n') {
        this.go('north');
      } else if (normalized === 'south' || normalized === 's') {
        this.go('south');
      } else if (normalized === 'east' || normalized === 'e') {
        this.go('east');
      } else if (normalized === 'west' || normalized === 'w') {
        this.go('west');
      } else if (normalized === 'go north') {
        this.go('north');
      } else if (normalized === 'go south') {
        this.go('south');
      } else if (normalized === 'go east') {
        this.go('east');
      } else if (normalized === 'go west') {
        this.go('west');
      } else if (normalized === 'quit' || normalized === 'exit') {
        if (Game.state.pendingQuit) {
          Game.state.mode = GameModes.GAME_OVER;
          Game.ui.print('', '');
          Game.ui.print('══════════════════════════════════════', 'separator');
          Game.ui.print('  GAME OVER', 'output-highlight');
          Game.ui.print('══════════════════════════════════════', 'separator');
          Game.ui.print('', '');
          Game.ui.print('Thank you for playing!', 'output-system');
          Game.ui.print('Type "restart" for a new game.', 'output-system');
        } else {
          Game.state.pendingQuit = true;
          Game.ui.print('Saving before quit is recommended!', 'output-system');
          Game.ui.print('Type "quit" again to confirm, or use a different command.', 'output-system');
        }
      } else if (normalized === 'inventory' || normalized === 'i' || normalized === 'inv') {
        this.showInventory();
      } else {
        Game.ui.print(`I don't understand that command. Try "help" for options.`, 'output-error');
      }
    };

    Game.engine.look = function() {
      if (!Game.state.player || !Game.state.player.location) {
        Game.ui.print('You are nowhere in particular.', 'output-narrative');
        return;
      }
      const locId = Game.state.player.location;
      const loc = Game.data.locations[locId];
      if (!loc) {
        Game.ui.print('This location does not exist.', 'output-error');
        return;
      }
      Game.ui.print(`  --- ${loc.name} ---`, 'output-highlight');
      Game.ui.print('', '');
      for (const desc of loc.descriptions) {
        Game.ui.print(`${desc.text}`, 'output-narrative');
      }
      Game.ui.print('', '');
      Game.ui.print('Exits:', 'output-system');
      for (const [dir, exit] of Object.entries(loc.exits)) {
        const exitLoc = Game.data.locations[exit.to];
        const exitName = exitLoc ? exitLoc.name : dir;

      calculateFinalStats: function() {
        const draft = this.characterDraft;

        const final = {};
        for (const stat of STAT_NAMES) {
          final[stat] = draft.baseStats[stat] + ((bg.statBonuses && bg.statBonuses[stat]) ? bg.statBonuses[stat] : 0);
        }
        return final;
      },

      calculateFinalSkills: function() {
        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        const final = {};
        for (const skill of Game.data.skills) {
          let val = 0;
          if (bg.skillBonuses && bg.skillBonuses[skill.id]) val += bg.skillBonuses[skill.id];
          if (draft.chosenSkills.includes(skill.id)) val += 1;
          final[skill.id] = val;
        }
        return final;
      },

        const draft = this.characterDraft;

        const maxStamina = 8 + finalStats.endurance + finalStats.might;
        const maxMana = bg.magical ? 4 + finalStats.will + finalStats.intellect : 0;

        const inventory = [];
        const equipment = { weapon: null, offhand: null, armor: null, cloak: null, accessory1: null, accessory2: null };

        for (const item of bg.startingItems) {
          if (item.slot && equipment[item.slot] === null) {
            equipment[item.slot] = item.itemId;
          } else {
            inventory.push({ itemId: item.itemId, quantity: item.quantity || 1 });
          }

        const reputation = Object.assign({}, bg.reputation);

        const player = {
          id: 'player',
          name: draft.name,
          background: draft.backgroundId,
          level: 1,
          xp: 0,
          stats: finalStats,
          skills: finalSkills,
          resources: {
            hp: maxHp, maxHp: maxHp,
            stamina: maxStamina, maxStamina: maxStamina,
            mana: maxMana, maxMana: maxMana

          equipment: equipment,
          gold: bg.startingGold,
          conditions: [],
          reputation: reputation,
          flags: Object.assign({}, bg.flags),

      handleStep1: function(input) {
        if (input.length < 1 || input.length > 24) {
          Game.ui.print('Please enter a name between 1 and 24 characters.', 'output-error');
          return;
        }
        if (input === 'back' || input === 'cancel') {
          this.initDraft();
          this.currentStep = 1;
          this.showStep1();
          return;
        }
        this.characterDraft.name = input.trim();
        this.currentStep = 2;
        this.showStep2();
      },

      handleStep2: function(input) {
        if (input === 'back') {
          this.currentStep = 1;
          this.showStep1();
          return;
        }

        let chosen = null;
        const num = parseInt(input, 10);
        if (!isNaN(num) && num >= 1 && num <= Game.data.backgrounds.length) {
          chosen = Game.data.backgrounds[num - 1];
        } else {
          for (const bg of Game.data.backgrounds) {
            if (bg.name.toLowerCase() === input || bg.id === input) {
              chosen = bg;
              break;
            }
          }
          if (!chosen) {
            for (const bg of Game.data.backgrounds) {
              if (bg.name.toLowerCase().includes(input)) {
                chosen = bg;
                break;
              }
            }
          }
        }

        if (!chosen) {
          Game.ui.print('Please choose a valid background by number or name.', 'output-error');
          return;
        }

        this.characterDraft.backgroundId = chosen.id;
        this.currentStep = 3;
        Game.ui.print(`  You chose: ${chosen.name}`, 'output-highlight');
        this.showStep3();
      },

      handleStep3: function(input) {
        const draft = this.characterDraft;
        const parts = input.split(/\s+/);

        if (input === 'back') {
          this.currentStep = 2;
          this.showStep2();
          return;
        }

        if (input === 'continue' || input === 'next' || input === 'done') {
          if (draft.allocatedStatPoints > draft.maxStatPoints) {
            Game.ui.print('You have used more points than allowed. Lower some stats first.', 'output-error');
            return;
          }
          this.currentStep = 4;
          this.showStep4();
          return;
        }

        if (input === 'help' || input === 'help stats') {
          Game.ui.print('', '');
          Game.ui.print('Stat Allocation Help:', 'output-highlight');
          Game.ui.print('  increase <stat>    - Raise a stat by 1 (costs 1 point)', 'output-narrative');
          Game.ui.print('  decrease <stat>    - Lower a stat by 1 (refunds 1 point)', 'output-narrative');
          Game.ui.print('  set <stat> <val>   - Set a stat to a specific value', 'output-narrative');
          Game.ui.print('  continue           - Move to next step', 'output-narrative');
          Game.ui.print('  back               - Go to previous step', 'output-narrative');
          Game.ui.print('', '');
          Game.ui.print('Stats: might, agility, endurance, intellect, will, presence', 'output-system');
          Game.ui.print('', '');
          this.displayStats();
          return;
        }

        if (parts[0] === 'increase' && parts[1]) {
          return this.increaseStat(parts[1]);
        }
        if (parts[0] === 'decrease' && parts[1]) {
          return this.decreaseStat(parts[1]);
        }
        if (parts[0] === 'set' && parts[1] && parts[2]) {
          const val = parseInt(parts[2], 10);
          if (isNaN(val)) {
            Game.ui.print('Please provide a valid number.', 'output-error');
            return;
          }
          return this.setStat(parts[1], val);
        }

        Game.ui.print('Unknown command. Try "increase might", "set will 2", "continue", or "help".', 'output-error');
      },

      increaseStat: function(statName) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] >= 3) {
          Game.ui.print(`${statName} is already at the maximum of 3.`, 'output-error');
          return;
        }
        const remaining = draft.maxStatPoints - draft.allocatedStatPoints;
        if (remaining <= 0) {
          Game.ui.print('No points remaining. Lower a stat or continue.', 'output-error');
          return;
        }
        draft.baseStats[statName]++;
        draft.allocatedStatPoints++;
        Game.ui.print(`${statName} increased to ${draft.baseStats[statName]}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      decreaseStat: function(statName) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] <= -1) {
          Game.ui.print(`${statName} is already at the minimum of -1.`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] === 0) {
          if (draft.sacrificedStat !== null) {
            Game.ui.print('You have already sacrificed one stat. You cannot sacrifice another.', 'output-error');
            return;
          }
        }
        const newTarget = draft.baseStats[statName] - 1;
        if (draft.baseStats[statName] === 0 && newTarget === -1) {
          draft.sacrificedStat = statName;
        }
        draft.baseStats[statName]--;
        draft.allocatedStatPoints = Math.max(0, draft.allocatedStatPoints - 1);
        Game.ui.print(`${statName} decreased to ${draft.baseStats[statName]}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      setStat: function(statName, value) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (value > 3) {
          Game.ui.print('No stat may be set above 3.', 'output-error');
          return;
        }
        if (value < -1) {
          Game.ui.print('No stat may be set below -1.', 'output-error');
          return;
        }
        if (value === -1 && draft.sacrificedStat !== null && draft.sacrificedStat !== statName) {
          Game.ui.print('Only one stat may be lowered to -1.', 'output-error');
          return;
        }

        const oldValue = draft.baseStats[statName];
        const cost = value - oldValue;
        const newAllocated = draft.allocatedStatPoints + cost;

        if (newAllocated > draft.maxStatPoints) {
          Game.ui.print(`Cannot set ${statName} to ${value}. Not enough points.`, 'output-error');
          return;
        }
        if (newAllocated < 0) {
          Game.ui.print(`Cannot set ${statName} to ${value}.`, 'output-error');
          return;
        }

        if (value === -1) {
          draft.sacrificedStat = statName;
        } else if (oldValue === -1 && value >= 0) {
          draft.sacrificedStat = null;
        }

        draft.baseStats[statName] = value;
        draft.allocatedStatPoints = newAllocated;
        Game.ui.print(`${statName} set to ${value}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      handleStep4: function(input) {
        const draft = this.characterDraft;
        const parts = input.split(/\s+/);

        if (input === 'back') {
          this.currentStep = 3;
          this.showStep3();
          return;
        }

        if (input === 'continue' || input === 'next' || input === 'done') {
          if (draft.chosenSkills.length < 4) {
            Game.ui.print(`You have trained ${draft.chosenSkills.length} of 4 skills. Train all 4 before continuing.`, 'output-error');
            return;
          }
          this.currentStep = 5;
          this.showStep5();
          return;
        }

        if (parts[0] === 'train' && parts[1]) {
          return this.trainSkill(parts.slice(1).join(' '));
        }
        if (parts[0] === 'untrain' && parts[1]) {
          return this.untrainSkill(parts.slice(1).join(' '));
        }

        Game.ui.print('Unknown command. Try "train stealth", "untrain lore", "continue", or "back".', 'output-error');
      },

      findSkillId: function(name) {
        const lower = name.toLowerCase();
        for (const skill of Game.data.skills) {
          if (skill.id === lower || skill.name.toLowerCase() === lower || skill.name.toLowerCase().includes(lower)) {
            return skill.id;
          }
        }
        return null;
      },

      getBackgroundSkillTotal: function(skillId) {
        const bg = Game.data.backgrounds.find(b => b.id === this.characterDraft.backgroundId);
        if (bg && bg.skillBonuses && bg.skillBonuses[skillId]) return bg.skillBonuses[skillId];
        return 0;
      },

      trainSkill: function(name) {
        const draft = this.characterDraft;
        const skillId = this.findSkillId(name);
        if (!skillId) {
          Game.ui.print(`Unknown skill: ${name}. Available: ${Game.data.skills.map(s => s.id).join(', ')}`, 'output-error');
          return;
        }
        if (draft.chosenSkills.includes(skillId)) {
          Game.ui.print(`${skillId} is already trained.`, 'output-error');
          return;
        }
        if (draft.chosenSkills.length >= 4) {
          Game.ui.print('You have already chosen 4 skills. Untrain one first.', 'output-error');
          return;
        }
        const bgBonus = this.getBackgroundSkillTotal(skillId);
        if (bgBonus + 1 > 3) {
          Game.ui.print(`Cannot train ${skillId}: would exceed the skill cap of 3.`, 'output-error');
          return;
        }
        draft.chosenSkills.push(skillId);
        Game.ui.print(`Trained: ${skillId} (+1). (${draft.chosenSkills.length}/4)`, 'output-system');
        Game.ui.print('');
        this.displaySkills();
      },

      untrainSkill: function(name) {
        const draft = this.characterDraft;
        const skillId = this.findSkillId(name);
        if (!skillId) {
          Game.ui.print(`Unknown skill: ${name}.`, 'output-error');
          return;
        }
        const idx = draft.chosenSkills.indexOf(skillId);
        if (idx === -1) {
          Game.ui.print(`${skillId} is not currently trained.`, 'output-error');
          return;
        }
        draft.chosenSkills.splice(idx, 1);
        Game.ui.print(`Untrained: ${skillId}. (${draft.chosenSkills.length}/4)`, 'output-system');
        Game.ui.print('');
        this.displaySkills();
      },

      handleStep5: function(input) {
        if (input === 'back') {
          this.currentStep = 4;
          this.showStep4();
          return;
        }
        if (input === 'continue' || input === 'next') {
          this.currentStep = 6;
          this.showStep6();
          return;
        }
        Game.ui.print('Type "continue" to proceed, or "back" to go to the previous step.', 'output-system');
      },

      handleStep6: function(input) {
        if (input === 'back') {
          this.currentStep = 5;
          this.showStep5();
          return;
        }
        if (input === 'confirm' || input === 'yes' || input === 'start') {
          this.currentStep = 7;
          this.showStep7();
          return;
        }
        if (input === 'restart') {
          this.start();
          return;
        }
        Game.ui.print('Type "confirm" to begin, "restart" to start over, or "back".', 'output-system');
      },

      handleInput: function(input) {
        switch (this.currentStep) {
          case 1: this.handleStep1(input); break;
          case 2: this.handleStep2(input); break;
          case 3: this.handleStep3(input); break;
          case 4: this.handleStep4(input); break;
          case 5: this.handleStep5(input); break;
          case 6: this.handleStep6(input); break;
        }
      }
    };

    Game.clock.init = function() {
      Game.state.clock = {
        day: 1,
        hour: 8,
        minute: 0,
        month: 'Frostwane'
      };
    };

    Game.inventory.init = function() {
      Game.state.inventory = [];
      Game.state.equipment = {
        weapon: null,
        offhand: null,
        armor: null,
        cloak: null,
        accessory1: null,
        accessory2: null
      };
    };

    Game.combat.init = function() {
      Game.state.inCombat = false;
      Game.state.currentEnemy = null;
    };

    Game.conditions.init = function() {
      Game.state.conditions = [];
    };

    Game.storage.init = function() {
      Game.state.saveSlots = 3;
    };

    Game.state.player = null;
    Game.state.flags = {};
    Game.state.variables = {};
    Game.state.world = {
      itemLocations: {},
      npcOverrides: {},
      monsterStates: {},
      locationStates: {}
    };

    Game.init = function() {
      this.clock.init();
      this.inventory.init();
      this.combat.init();
      this.conditions.init();
      this.storage.init();
      
      Game.ui.showTitle();
      Game.ui.print('', '');
    };

    const commandInput = document.getElementById('command-input');
    
    commandInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const value = this.value;
        this.value = '';
        Game.ui.handleInput(value);
      }
    });

    commandInput.addEventListener('focus', function() {
      document.querySelector('.cursor').style.display = 'none';
    });

    commandInput.addEventListener('blur', function() {
      document.querySelector('.cursor').style.display = 'inline-block';
      this.focus();
    });

    setTimeout(() => commandInput.focus(), 100);
    Game.init();
  </script>
</body>
</html>
