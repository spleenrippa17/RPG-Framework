<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      background-color: #0f0f1e;
      border-bottom: 2px solid #4a4a7a;
      padding: 12px 20px;
      text-align: center;
      color: #8be9fd;
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(139, 233, 253, 0.5);
    }

    #main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #output-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #16213e;
      border-right: 2px solid #4a4a7a;
    }

    #output-area::-webkit-scrollbar {
      width: 8px;
    }

    #output-area::-webkit-scrollbar-track {
      background: #0f0f1e;
    }

    #output-area::-webkit-scrollbar-thumb {
      background: #4a4a7a;
      border-radius: 4px;
    }

    #output-area::-webkit-scrollbar-thumb:hover {
      background: #6c6ca0;
    }

    .output-line {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .output-command {
      color: #50fa7b;
      font-weight: bold;
    }

    .output-narrative {
      color: #f8f8f2;
    }

    .output-system {
      color: #bd93f9;
      font-style: italic;
    }

    .output-error {
      color: #ff5555;
    }

    .output-highlight {
      color: #ffb86c;
    }

    #sidebar {
      width: 280px;
      background-color: #0f0f1e;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    .sidebar-title {
      color: #ff79c6;
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #4a4a7a;
      padding-bottom: 5px;
    }

    .sidebar-content {
      color: #ccc;
      font-size: 0.9em;
      line-height: 1.6;
    }

    #input-area {
      background-color: #0f0f1e;
      border-top: 2px solid #4a4a7a;
      padding: 15px 20px;
      display: flex;
      align-items: center;
    }

    #prompt {
      color: #8be9fd;
      margin-right: 10px;
      font-weight: bold;
    }

    #command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8f8f2;
      font-family: inherit;
      font-size: 1em;
      caret-color: #50fa7b;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background-color: #50fa7b;
      animation: blink 1s infinite;
    }

    .separator {
      color: #4a4a7a;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>

    Game.ui.handleInput = function(input) {
      if (!input.trim()) return;
      
      this.echoCommand(input);
      Game.data.commandHistory.push(input);
      
      const trimmed = input.trim().toLowerCase();
      
      switch (Game.state.mode) {
        case GameModes.TITLE:
          this.handleTitleInput(trimmed);
          break;
        case GameModes.CHARACTER_CREATION:
          Game.characterCreation.handleInput(trimmed);
          break;
        case GameModes.PLAYING:
          Game.engine.handleCommand(trimmed);
          break;
        case GameModes.GAME_OVER:
          this.handleGameOverInput(trimmed);
          break;
      }
    };

    Game.ui.handleTitleInput = function(input) {
      if (input === 'start' || input === 'begin' || input === 'play') {
        this.print('', '');
        this.print('Starting new adventure...', 'output-system');
        this.print('', '');
        
        Game.characterCreation.start();
        Game.state.mode = GameModes.CHARACTER_CREATION;
      } else if (input === 'help') {
        this.showHelp(Game.engine.availableCommands.title);
      } else if (input === 'clear') {
        this.clearOutput();
        setTimeout(() => this.showTitle(), 100);
      } else if (input === 'about') {
        this.showAbout();
      } else {
        this.print('Please type "start" to begin your adventure.', 'output-system');
      }
    };

    Game.ui.handleGameOverInput = function(input) {
      if (input === 'restart' || input === 'start' || input === 'new') {
        location.reload();
      } else if (input === 'quit' || input === 'exit') {
        this.print('Thank you for playing!', 'output-system');
        setTimeout(() => window.close(), 2000);
      } else {
        this.print('Type "restart" for a new game or "quit" to exit.', 'output-system');
      }
    };

      this.print('', '');
      
      if (commands) {
        commands.forEach(cmd => {

    Game.parser.normalize = function(input) {
      return input.toLowerCase().trim().replace(/\s+/g, ' ');
    };

    Game.engine.availableCommands = {
      title: [
        { name: 'start', description: 'Begin a new adventure' },
        { name: 'help', description: 'Show available commands' },
        { name: 'clear', description: 'Clear the screen' },
        { name: 'attack [target]', description: 'Attack a monster' },
        { name: 'about', description: 'Display game information' }
      ]
    };

    Game.engine.take = function(itemName) {
      const player = Game.state.player;
      const loc = Game.data.locations[player.location];
      if (!loc) {
        Game.ui.print('You are nowhere in particular.', 'output-error');
        return;
      }
      
      if (!itemName) {
        Game.ui.print('Take what?', 'output-error');
        return;
      }
      
      const staticIdx = loc.items.findIndex(id => {
        const item = Game.data.items[id];
        if (!item) return false;
        return item.name === itemName || (item.aliases && item.aliases.includes(itemName));
      });
      
      const locItems = Game.state.world.itemLocations[player.location] || [];
      const dynamicIdx = locItems.findIndex(id => {
        const item = Game.data.items[id];
        if (!item) return false;
        return item.name === itemName || (item.aliases && item.aliases.includes(itemName));
      });
      
      let foundId = null;
      let source = null;
      
      if (staticIdx !== -1) {
        foundId = loc.items[staticIdx];
        source = 'static';
      } else if (dynamicIdx !== -1) {
        foundId = locItems[dynamicIdx];
        source = 'dynamic';
      }
      
      if (!foundId) {
        Game.ui.print(`You don't see "${itemName}" here.`, 'output-error');
        return;
      }
      
      const itemData = Game.data.items[foundId];
      if (!itemData.portable) {
        Game.ui.print(`You can't take the ${itemData.name}.`, 'output-error');
        return;
      }
      
      const oldTier = Game.inventory.getEncumbranceTier().tier;
      
      if (source === 'static') {
        loc.items.splice(staticIdx, 1);
      } else {
        locItems.splice(dynamicIdx, 1);
        Game.state.world.itemLocations[player.location] = locItems;
      }
      
      Game.inventory.addItem(foundId, 1);
      
      const newTier = Game.inventory.getEncumbranceTier().tier;
      
      Game.ui.print(`You pick up the ${itemData.name}.`, 'output-narrative');
      
      if (oldTier !== newTier && newTier !== 'unencumbered') {
        Game.ui.print(`You are now ${newTier}!`, 'output-highlight');
      }
      
      const msgs = Game.clock.advanceTime(1);
      for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
    };

    Game.engine.drop = function(input) {
      const player = Game.state.player;
      
      let quantity = 1;
      let itemName = input;
      
      const match = input.match(/^(\d+)\s+(.+)$/);
      if (match) {
        quantity = parseInt(match[1], 10);
        itemName = match[2];
      }
      
      const entry = player.inventory.find(e => {
        const item = Game.data.items[e.itemId];
        if (!item) return false;
        return item.name === itemName || (item.aliases && item.aliases.includes(itemName));
      });
      
      if (!entry) {
        Game.ui.print(`You don't have "${itemName}".`, 'output-error');
        return;
      }
      
      if (entry.quantity < quantity) {
        Game.ui.print(`You only have ${entry.quantity} ${Game.data.items[entry.itemId].name}.`, 'output-error');
        return;
      }
      
      const itemData = Game.data.items[entry.itemId];
      
      Game.inventory.removeItem(entry.itemId, quantity);
      
      const locId = player.location;
      if (!Game.state.world.itemLocations[locId]) {
        Game.state.world.itemLocations[locId] = [];
      }
      for (let i = 0; i < quantity; i++) {
        Game.state.world.itemLocations[locId].push(entry.itemId);
      }
      
      const qtyText = quantity > 1 ? `${quantity} ${itemData.name}` : `the ${itemData.name}`;
      Game.ui.print(`You drop ${qtyText}.`, 'output-narrative');
      
      const msgs = Game.clock.advanceTime(1);
      for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
    };

    Game.engine.equip = function(itemName) {
      const player = Game.state.player;
      
      if (!itemName) {
        Game.ui.print('Equip what?', 'output-error');
        return;
      }
      
      const entry = player.inventory.find(e => {
        const item = Game.data.items[e.itemId];
        if (!item) return false;
        return item.name === itemName || (item.aliases && item.aliases.includes(itemName));
      });
      
      if (!entry) {
        Game.ui.print(`You don't have "${itemName}".`, 'output-error');
        return;
      }
      
      const itemData = Game.data.items[entry.itemId];
      if (!itemData.slot) {
        Game.ui.print(`You can't equip the ${itemData.name}.`, 'output-error');
        return;
      }
      
      const slot = itemData.slot;
      
      if (player.equipment[slot]) {
        const currentItemId = player.equipment[slot];
        const currentItem = Game.data.items[currentItemId];
        Game.inventory.addItem(currentItemId, 1);
        Game.ui.print(`You remove the ${currentItem ? currentItem.name : currentItemId}.`, 'output-narrative');
      }
      
      Game.inventory.removeItem(entry.itemId, 1);
      
      player.equipment[slot] = entry.itemId;
      
      Game.ui.print(`You equip the ${itemData.name}.`, 'output-narrative');
      
      let timeCost = 1;
      if (slot === 'armor') timeCost = 5;
      
      const msgs = Game.clock.advanceTime(timeCost);
      for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
    };

    Game.engine.unequip = function(itemName) {
      const player = Game.state.player;
      
      if (!itemName) {
        Game.ui.print('Unequip what?', 'output-error');
        return;
      }
      
      let foundSlot = null;
      let foundItemId = null;
      
      for (const [slot, itemId] of Object.entries(player.equipment)) {
        if (!itemId) continue;
        const item = Game.data.items[itemId];
        if (item && (item.name === itemName || (item.aliases && item.aliases.includes(itemName)))) {
          foundSlot = slot;
          foundItemId = itemId;
          break;
        }
        if (slot === itemName) {
          foundSlot = slot;
          foundItemId = itemId;
          break;
        }
      }
      
      if (!foundSlot || !foundItemId) {
        Game.ui.print(`You aren't wearing/holding "${itemName}".`, 'output-error');
        return;
      }
      
      const itemData = Game.data.items[foundItemId];
      
      Game.inventory.addItem(foundItemId, 1);
      player.equipment[foundSlot] = null;
      
      Game.ui.print(`You remove the ${itemData ? itemData.name : foundItemId}.`, 'output-narrative');
      
      let timeCost = 1;
      if (foundSlot === 'armor') timeCost = 3;
      
      Game.clock.advanceTime(timeCost);
    };

    Game.engine.wait = function(args) {
      let minutes = 15;
      if (args) {
        const restParts = args.trim().toLowerCase();
        if (restParts === '' || restParts === 'a' || restParts === 'awhile' || restParts === 'a while') {
          minutes = 15;
        } else if (restParts === '1 hour' || restParts === 'hour' || restParts === 'an hour') {
          minutes = 60;
        } else {
          const hourMatch = restParts.match(/^(\d+)\s*(?:hour|hr|hours|hrs|h)$/);
          const minMatch = restParts.match(/^(\d+)\s*(?:minute|minutes|min|mins|m)$/);
          if (hourMatch) {
            minutes = parseInt(hourMatch[1], 10) * 60;
          } else if (minMatch) {
            minutes = parseInt(minMatch[1], 10);
          } else {
            const pureNum = parseInt(restParts, 10);
            if (!isNaN(pureNum) && pureNum > 0) {
              minutes = pureNum;
            }
          }
        }
      }
      if (minutes <= 0) minutes = 15;
      Game.ui.print('You wait for a while...', 'output-narrative');
      const msgs = Game.clock.advanceTime(minutes);
      for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
      Game.ui.print('  (' + minutes + ' minutes passed)', 'output-system');
    };

    Game.engine.sleep = function(args) {
      let hours = 8;
      if (args) {
        const restParts = args.trim().toLowerCase();
        const hourMatch = restParts.match(/^(\d+)\s*(?:hour|hr|hours|hrs|h)?$/);
        if (hourMatch) {
          hours = parseInt(hourMatch[1], 10);
        }
      }
      if (hours <= 0) hours = 1;
      if (hours > 12) hours = 12;
      Game.ui.print('You find a comfortable spot and settle down to rest...', 'output-narrative');
      const sleepMsgs = Game.clock.advanceTime(hours * 60);
      for (const msg of sleepMsgs) { Game.ui.print(msg, 'output-system'); }
      const player = Game.state.player;
      if (player && player.resources) {
        const staminaRecovery = Math.floor(player.resources.maxStamina * 0.5);
        player.resources.stamina = Math.min(player.resources.maxStamina, player.resources.stamina + staminaRecovery);
        if (player.resources.maxHp === 0 || player.resources.hp < player.resources.maxHp) {
          Game.ui.print('You feel somewhat rested.', 'output-narrative');
        }
      }
      Game.ui.print('  (' + hours + ' hours passed — ' + Game.clock.formatTime() + ')', 'output-system');
    };

    Game.engine.handleCommand = function(input) {
      const normalized = Game.parser.normalize(input);
      
      if (normalized === 'help') {
        Game.ui.showHelp(this.availableCommands.playing);
      } else if (normalized === 'clear') {
        Game.ui.clearOutput();
      } else if (normalized === 'about') {
        Game.ui.showAbout();
      } else if (normalized === 'look' || normalized === 'l') {
        this.look();
      } else if (normalized === 'north' || normalized === 'n') {
        this.go('north');
      } else if (normalized === 'south' || normalized === 's') {
        this.go('south');
      } else if (normalized === 'east' || normalized === 'e') {
        this.go('east');
      } else if (normalized === 'west' || normalized === 'w') {
        this.go('west');
      } else if (normalized === 'go north') {
        this.go('north');
      } else if (normalized === 'go south') {
        this.go('south');
      } else if (normalized === 'go east') {
        this.go('east');
      } else if (normalized === 'go west') {
        this.go('west');
      } else if (normalized === 'quit' || normalized === 'exit') {
        Game.ui.print('Saving before quit is recommended!', 'output-system');
        Game.ui.print('Type "quit" again to confirm, or use a different command.', 'output-system');
      } else if (normalized === 'inventory' || normalized === 'i' || normalized === 'inv' || normalized === 'status' || normalized === 'equipment' || normalized === 'gear') {
        this.showInventory();
      } else if (normalized.startsWith('take ') || normalized.startsWith('get ') || normalized.startsWith('grab ') || normalized.startsWith('pickup ') || normalized.startsWith('pick up ')) {
        const itemName = normalized.replace(/^(take|get|grab|pickup|pick up)\s+/, '');
        this.take(itemName);
      } else if (normalized.startsWith('drop ')) {
        const itemName = normalized.replace(/^drop\s+/, '');
        this.drop(itemName);
      } else if (normalized.startsWith('equip ') || normalized.startsWith('wield ') || normalized.startsWith('wear ') || normalized.startsWith('put on ')) {
        const itemName = normalized.replace(/^(equip|wield|wear|put on)\s+/, '');
        this.equip(itemName);
      } else if (normalized.startsWith('unequip ') || normalized.startsWith('remove ') || normalized.startsWith('take off ')) {
        const itemName = normalized.replace(/^(unequip|remove|take off)\s+/, '');
        this.unequip(itemName);
      } else if (normalized === 'wait') {
        this.wait(null);
      } else if (normalized.startsWith('wait ')) {
        const args = normalized.replace(/^wait\s+/, '');
        this.wait(args);
      } else if (normalized === 'sleep' || normalized === 'rest') {
        this.sleep(null);
      } else if (normalized.startsWith('sleep ') || normalized.startsWith('rest ')) {
        const args = normalized.replace(/^(sleep|rest)\s+/, '');
        this.sleep(args);
      } else if (normalized.startsWith('talk to ') || normalized.startsWith('talk ') || normalized.startsWith('speak to ') || normalized.startsWith('speak with ') || normalized.startsWith('ask ')) {
        const target = normalized.replace(/^(talk to|talk|speak to|speak with|ask)\s+/, '');
        this.talk(target);
      } else if (normalized.startsWith('look at ') || normalized.startsWith('examine ') || normalized.startsWith('inspect ') || normalized.startsWith('x ')) {
        const target = normalized.replace(/^(look at|examine|inspect|x)\s+/, '');
        this.lookAt(target);
      } else if (normalized === 'attack' || normalized === 'strike' || normalized === 'hit' || normalized === 'fight') {
        Game.combat.attack(null);
      } else if (normalized.startsWith('attack ') || normalized.startsWith('strike ') || normalized.startsWith('hit ') || normalized.startsWith('fight ') || normalized.startsWith('shoot ')) {
        const target = normalized.replace(/^(attack|strike|hit|fight|shoot)\s+/, '');
        Game.combat.attack(target);
      } else {
        Game.ui.print(`I don't understand that command. Try "help" for options.`, 'output-error');
      }
    };

      Game.ui.print(`  Time: ${Game.clock.formatTime()}`, 'output-system');
      Game.ui.print('', '');
      Game.ui.print(`  Health:   ${player.resources.hp} / ${player.resources.maxHp}`, 'output-narrative');
      Game.ui.print(`  Stamina:  ${player.resources.stamina} / ${player.resources.maxStamina}`, 'output-narrative');

      if (player.conditions && player.conditions.length > 0) {

          const condName = condData ? condData.name : cond.id;
          const remaining = cond.remainingMinutes > 0 ? ` (${cond.remainingMinutes} min remaining)` : '';
          Game.ui.print(`    - ${condName}${remaining}`, 'output-highlight');
          if (condData && condData.description) {
            Game.ui.print(`      ${condData.description}`, 'output-system');
          }
          if (condData && condData.modifiers) {
            const mods = Object.entries(condData.modifiers).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ');
            if (mods) Game.ui.print(`      Modifiers: ${mods}`, 'output-system');
          }
        }
        Game.ui.print('', '');
      }
      Game.ui.print(`  Gold: ${player.gold}`, 'output-narrative');
      Game.ui.print('', '');
      const carriedWeight = Game.inventory.getCarriedWeight();
      const carryCapacity = Game.inventory.getCarryCapacity();
      const encumbrance = Game.inventory.getEncumbranceTier();
      Game.ui.print(`  Weight: ${carriedWeight} / ${carryCapacity} lb`, 'output-narrative');
      Game.ui.print(`  Encumbrance: ${encumbrance.tier}`, 'output-narrative');
      if (encumbrance.tier === 'burdened') {
        Game.ui.print('    (Stealth -1, Agility -1)', 'output-system');
      } else if (encumbrance.tier === 'encumbered') {
        Game.ui.print('    (Stealth -2, Agility -2, Travel time ×1.5)', 'output-system');
      } else if (encumbrance.tier === 'overloaded') {
        Game.ui.print('    (Cannot travel!)', 'output-error');

        Game.ui.print('  Carried Items: None', 'output-system');
      } else {

          const name = item ? item.name : entry.itemId;
          const weight = item ? (item.weight || 0) * entry.quantity : 0;

        }
      }
