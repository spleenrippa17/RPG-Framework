    Game.engine.look = function() {
      if (!Game.state.player || !Game.state.player.location) {
        Game.ui.print('You are nowhere in particular.', 'output-narrative');
        return;
      }
      const locId = Game.state.player.location;
      const loc = Game.data.locations[locId];
      if (!loc) {
        Game.ui.print('This location does not exist.', 'output-error');
        return;
      }
      Game.ui.print(`  --- ${loc.name} ---`, 'output-highlight');
      Game.ui.print('', '');
      for (const desc of loc.descriptions) {
        Game.ui.print(`${desc.text}`, 'output-narrative');
      }
      Game.ui.print('', '');
      Game.ui.print('Exits:', 'output-system');
      for (const [dir, exit] of Object.entries(loc.exits)) {
        const exitLoc = Game.data.locations[exit.to];
        const exitName = exitLoc ? exitLoc.name : dir;
        Game.ui.print(`  ${dir.padEnd(8)} - ${exitName}`, 'output-narrative');
      }
      Game.ui.print('', '');
      
      const presentNPCs = Game.schedules.getPresentNPCs(locId);
      for (const entry of presentNPCs) {
        const activityText = entry.activity ? ` (${entry.activity})` : '';
        Game.ui.print(`  ${entry.npc.name} is here${activityText}.`, 'output-highlight');
      }
      if (presentNPCs.length > 0) Game.ui.print('', '');

      const presentMonsters = Game.schedules.getPresentMonsters(locId);
      for (const entry of presentMonsters) {
        Game.ui.print(`  ${entry.monster.name} is here!`, 'output-error');
      }
      if (presentMonsters.length > 0) Game.ui.print('', '');
      
      const allItems = [];
      if (loc.items && loc.items.length > 0) {
        for (const id of loc.items) {
          const item = Game.data.items[id];
          if (item) allItems.push(item.name);
        }
      }
      const dynamicItems = Game.state.world.itemLocations[locId] || [];
      for (const id of dynamicItems) {
        const item = Game.data.items[id];
        if (item) allItems.push(item.name);
      }
      
      if (allItems.length > 0) {
        Game.ui.print('You notice: ' + allItems.join(', '), 'output-system');
        Game.ui.print('', '');
      }
    };

    Game.engine.go = function(direction) {
      const player = Game.state.player;
      const loc = Game.data.locations[player.location];
      if (!loc || !loc.exits[direction]) {
        Game.ui.print(`You cannot go ${direction}.`, 'output-error');
        return;
      }
      const exit = loc.exits[direction];
      const travelMinutes = exit.travelMinutes || 1;
      player.location = exit.to;
      const msgs = Game.clock.advanceTime(travelMinutes);
      const newLoc = Game.data.locations[exit.to];
      if (newLoc) {
        Game.ui.print('', '');
        Game.ui.print(`You head ${direction}...`, 'output-narrative');
        for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
        Game.ui.print('', '');
        this.look();
      }
    };

    Game.engine.talk = function(target) {
      if (!target) {
        Game.ui.print('Talk to whom?', 'output-error');
        return;
      }
      const npc = Game.schedules.findNPCByName(target);
      if (!npc) {
        const monster = Game.schedules.findMonsterByName(target);
        if (monster) {
          const present = Game.schedules.isMonsterPresent(monster, Game.state.player.location);
          if (!present) {
            Game.ui.print(`You don't see ${monster.name} here.`, 'output-error');
            return;
          }
          Game.ui.print(monster.description, 'output-narrative');
          return;
        }
        Game.ui.print(`You don't see anyone by that name here.`, 'output-error');
        return;
      }
      const playerLoc = Game.state.player.location;
      const present = Game.schedules.isNPCPresent(npc, playerLoc);
      if (!present) {
        Game.ui.print(`${npc.name} is not here.`, 'output-error');
        return;
      }
      const activity = Game.schedules.getActivity(npc, Game.state.clock);
      if (activity) {
        Game.ui.print(`You approach ${npc.name} (${activity}).`, 'output-narrative');
      } else {
        Game.ui.print(`You approach ${npc.name}.`, 'output-narrative');
      }
      Game.ui.print('', '');
      Game.ui.print(npc.description, 'output-narrative');
      const msgs = Game.clock.advanceTime(5);
      for (const msg of msgs) { Game.ui.print(msg, 'output-system'); }
    };

    Game.engine.lookAt = function(target) {
      if (!target) {
        Game.ui.print('Look at what?', 'output-error');
        return;
      }
      const npc = Game.schedules.findNPCByName(target);
      if (npc) {
        const present = Game.schedules.isNPCPresent(npc, Game.state.player.location);
        if (!present) {
          Game.ui.print(`You don't see ${npc.name} here.`, 'output-error');
          return;
        }
        const activity = Game.schedules.getActivity(npc, Game.state.clock);
        let text = npc.description;
        if (activity) text += ` ${npc.name.split(' ')[0]} is ${activity}.`;
        Game.ui.print(text, 'output-narrative');
        return;
      }
      const monster = Game.schedules.findMonsterByName(target);
      if (monster) {
        const present = Game.schedules.isMonsterPresent(monster, Game.state.player.location);
        if (!present) {
          Game.ui.print(`You don't see ${monster.name} here.`, 'output-error');
          return;
        }
        Game.ui.print(monster.description, 'output-narrative');
        return;
      }
      const item = Object.values(Game.data.items).find(i => i.name.toLowerCase() === target || i.name.toLowerCase().includes(target));
      if (item) {
        Game.ui.print(item.description || `You see nothing special about the ${item.name}.`, 'output-narrative');
        return;
      }
      Game.ui.print(`You don't see "${target}" here.`, 'output-error');
    };

    Game.characterCreation = {
      currentStep: 0,
      characterDraft: null,

      initDraft: function() {
        this.characterDraft = {
          name: '',
          backgroundId: null,
          baseStats: { might: 0, agility: 0, endurance: 0, intellect: 0, will: 0, presence: 0 },
          allocatedStatPoints: 0,
          maxStatPoints: 6,
          chosenSkills: [],
          finalStats: {},
          finalSkills: {},
          startingItems: [],
          startingGold: 0,
          sacrificedStat: null
        };
        this.currentStep = 1;
      },

      start: function() {
        this.initDraft();
        Game.ui.print('', '');
        this.showStep1();
      },

      showStep1: function() {
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  CREATE YOUR CHARACTER', 'output-highlight');
        Game.ui.print('  Step 1 of 7: Enter Your Name', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');
        Game.ui.print('What is your name, adventurer?', 'output-narrative');
        Game.ui.print('', '');
        Game.ui.print('Type your character name.', 'output-system');
      },

      showStep2: function() {
        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 2 of 7: Choose Your Background', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');
        const backgrounds = Game.data.backgrounds;
        for (let i = 0; i < backgrounds.length; i++) {
          const bg = backgrounds[i];
          Game.ui.print(`  ${i + 1}. ${bg.name}`, 'output-highlight');
          Game.ui.print(`     ${bg.description}`, 'output-narrative');
          Game.ui.print('', '');
        }
        Game.ui.print('Type a number (1-7) or the background name.', 'output-system');
        Game.ui.print('Type "back" to go to the previous step.', 'output-system');
      },

      showStep3: function() {
        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 3 of 7: Allocate Stat Points', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');
        Game.ui.print('You have 6 points to spend. No stat may exceed 3.', 'output-narrative');
        Game.ui.print('You may lower one stat to -1 to gain an extra point.', 'output-narrative');
        Game.ui.print('', '');
        this.displayStats();
        Game.ui.print('', '');
        Game.ui.print('Commands:', 'output-system');
        Game.ui.print('  increase might     - Raise a stat by 1', 'output-narrative');
        Game.ui.print('  decrease agility   - Lower a stat by 1', 'output-narrative');
        Game.ui.print('  set will 2         - Set a stat to a value', 'output-narrative');
        Game.ui.print('  continue           - Move to next step', 'output-narrative');
        Game.ui.print('  back               - Go to previous step', 'output-narrative');
      },

      displayStats: function() {
        const draft = this.characterDraft;
        const remaining = draft.maxStatPoints - draft.allocatedStatPoints;
        Game.ui.print(`  Points remaining: ${remaining}`, 'output-highlight');
        Game.ui.print('', '');
        for (const stat of STAT_NAMES) {
          const val = draft.baseStats[stat];
          const label = stat.charAt(0).toUpperCase() + stat.slice(1);
          const padded = label.padEnd(12);
          Game.ui.print(`  ${padded}${val}`, 'output-narrative');
        }
      },

      showStep4: function() {
        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 4 of 7: Choose Trained Skills', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');
        Game.ui.print('Choose 4 skills to train. Each gets +1. No skill above 3.', 'output-narrative');
        Game.ui.print('', '');
        this.displaySkills();
        Game.ui.print('', '');
        Game.ui.print('Commands:', 'output-system');
        Game.ui.print('  train stealth      - Train a skill', 'output-narrative');
        Game.ui.print('  untrain lore       - Untrain a skill', 'output-narrative');
        Game.ui.print('  continue           - Move to next step', 'output-narrative');
        Game.ui.print('  back               - Go to previous step', 'output-narrative');
      },

      displaySkills: function() {
        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        Game.ui.print(`  Skills trained: ${draft.chosenSkills.length} / 4`, 'output-highlight');
        Game.ui.print('', '');
        for (const skill of Game.data.skills) {
          const bgBonus = (bg && bg.skillBonuses && bg.skillBonuses[skill.id]) ? bg.skillBonuses[skill.id] : 0;
          const trained = draft.chosenSkills.includes(skill.id) ? 1 : 0;
          const total = bgBonus + trained;
          const trainedMark = trained ? ' [TRAINED]' : '';
          const bgMark = bgBonus > 0 ? ` (+${bgBonus} bg)` : '';
          const label = skill.name.padEnd(16);
          Game.ui.print(`  ${label}${total}${bgMark}${trainedMark}`, 'output-narrative');
        }
      },

      showStep5: function() {
        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 5 of 7: Review Starting Equipment', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');

        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);

        Game.ui.print(`  Starting Gold: ${bg.startingGold}`, 'output-highlight');
        Game.ui.print('', '');
        Game.ui.print('  Starting Items:', 'output-narrative');
        for (const item of bg.startingItems) {
          const data = Game.data.items[item.itemId];
          const name = data ? data.name : item.itemId;
          Game.ui.print(`    - ${name}`, 'output-narrative');
        }

        Game.ui.print('', '');
        Game.ui.print('  Starting Equipment:', 'output-narrative');
        const equipItems = bg.startingItems.filter(i => i.slot);
        if (equipItems.length === 0) {
          Game.ui.print('    None', 'output-system');
        } else {
          for (const item of equipItems) {
            const data = Game.data.items[item.itemId];
            const name = data ? data.name : item.itemId;
            Game.ui.print(`    ${item.slot}: ${name}`, 'output-narrative');
          }
        }

        Game.ui.print('', '');
        Game.ui.print('Type "continue" to proceed, or "back" to go to the previous step.', 'output-system');
      },

      showStep6: function() {
        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 6 of 7: Confirm Your Character', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');

        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        const finalStats = this.calculateFinalStats();
        const finalSkills = this.calculateFinalSkills();
        const maxHp = 10 + 2 * finalStats.endurance;
        const maxStamina = 8 + finalStats.endurance + finalStats.might;
        const maxMana = bg.magical ? 4 + finalStats.will + finalStats.intellect : 0;

        Game.ui.print(`  Name:       ${draft.name}`, 'output-highlight');
        Game.ui.print(`  Background: ${bg.name}`, 'output-highlight');
        Game.ui.print('', '');
        Game.ui.print('  Stats:', 'output-narrative');
        for (const stat of STAT_NAMES) {
          const label = stat.charAt(0).toUpperCase() + stat.slice(1);
          Game.ui.print(`    ${label.padEnd(12)}${finalStats[stat]}`, 'output-narrative');
        }
        Game.ui.print('', '');
        Game.ui.print('  Skills:', 'output-narrative');
        for (const skill of Game.data.skills) {
          if (finalSkills[skill.id] > 0) {
            Game.ui.print(`    ${skill.name.padEnd(16)}${finalSkills[skill.id]}`, 'output-narrative');
          }
        }
        Game.ui.print('', '');
        Game.ui.print(`  Health:   ${maxHp}`, 'output-narrative');
        Game.ui.print(`  Stamina:  ${maxStamina}`, 'output-narrative');
        if (bg.magical) {
          Game.ui.print(`  Mana:     ${maxMana}`, 'output-narrative');
        }
        Game.ui.print(`  Gold:     ${bg.startingGold}`, 'output-narrative');

        Game.ui.print('', '');
        Game.ui.print('Type "confirm" to begin your adventure.', 'output-system');
        Game.ui.print('Type "restart" to start over, or "back" to go to the previous step.', 'output-system');
      },

      calculateFinalStats: function() {
        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        const final = {};
        for (const stat of STAT_NAMES) {
          final[stat] = draft.baseStats[stat] + ((bg.statBonuses && bg.statBonuses[stat]) ? bg.statBonuses[stat] : 0);
        }
        return final;
      },

      calculateFinalSkills: function() {
        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        const final = {};
        for (const skill of Game.data.skills) {
          let val = 0;
          if (bg.skillBonuses && bg.skillBonuses[skill.id]) val += bg.skillBonuses[skill.id];
          if (draft.chosenSkills.includes(skill.id)) val += 1;
          final[skill.id] = val;
        }
        return final;
      },

      createPlayer: function() {
        const draft = this.characterDraft;
        const bg = Game.data.backgrounds.find(b => b.id === draft.backgroundId);
        const finalStats = this.calculateFinalStats();
        const finalSkills = this.calculateFinalSkills();
        const maxHp = 10 + 2 * finalStats.endurance;
        const maxStamina = 8 + finalStats.endurance + finalStats.might;
        const maxMana = bg.magical ? 4 + finalStats.will + finalStats.intellect : 0;

        const inventory = [];
        const equipment = { weapon: null, offhand: null, armor: null, cloak: null, accessory1: null, accessory2: null };

        for (const item of bg.startingItems) {
          if (item.slot && equipment[item.slot] === null) {
            equipment[item.slot] = item.itemId;
          } else {
            inventory.push({ itemId: item.itemId, quantity: item.quantity || 1 });
          }
        }

        const reputation = Object.assign({}, bg.reputation);

        const player = {
          id: 'player',
          name: draft.name,
          background: draft.backgroundId,
          level: 1,
          xp: 0,
          stats: finalStats,
          skills: finalSkills,
          resources: {
            hp: maxHp, maxHp: maxHp,
            stamina: maxStamina, maxStamina: maxStamina,
            mana: maxMana, maxMana: maxMana
          },
          inventory: inventory,
          equipment: equipment,
          gold: bg.startingGold,
          conditions: [],
          reputation: reputation,
          flags: Object.assign({}, bg.flags),
          location: 'village_square'
        };

        return player;
      },

      showStep7: function() {
        Game.state.player = this.createPlayer();

        Game.ui.print('', '');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('  Step 7 of 7: Your Adventure Begins', 'output-highlight');
        Game.ui.print('══════════════════════════════════════', 'separator');
        Game.ui.print('', '');
        Game.ui.print(`  Welcome, ${Game.state.player.name}.`, 'output-highlight');
        Game.ui.print('', '');

        this.showOpeningScene();

        Game.state.mode = GameModes.PLAYING;
      },

      showOpeningScene: function() {
        const loc = Game.data.locations.village_square;
        Game.ui.print(`  --- ${loc.name} ---`, 'output-highlight');
        Game.ui.print('', '');
        for (const desc of loc.descriptions) {
          Game.ui.print(`  ${desc.text}`, 'output-narrative');
          Game.ui.print('', '');
        }

        Game.ui.print('  Exits:', 'output-system');
        for (const [dir, exit] of Object.entries(loc.exits)) {
          const exitLoc = Game.data.locations[exit.to];
          const exitName = exitLoc ? exitLoc.name : dir;
          Game.ui.print(`    ${dir.padEnd(8)} - ${exitName}`, 'output-narrative');
        }
        Game.ui.print('', '');

        if (loc.items && loc.items.length > 0) {
          Game.ui.print('  You notice: ' + loc.items.map(id => {
            const item = Game.data.items[id];
            return item ? item.name : id;
          }).join(', '), 'output-system');
          Game.ui.print('', '');
        }

        Game.ui.print('Type "help" for available commands.', 'output-system');
      },

      handleStep1: function(input) {
        if (input.length < 1 || input.length > 24) {
          Game.ui.print('Please enter a name between 1 and 24 characters.', 'output-error');
          return;
        }
        if (input === 'back' || input === 'cancel') {
          this.initDraft();
          this.currentStep = 1;
          this.showStep1();
          return;
        }
        this.characterDraft.name = input.trim();
        this.currentStep = 2;
        this.showStep2();
      },

      handleStep2: function(input) {
        if (input === 'back') {
          this.currentStep = 1;
          this.showStep1();
          return;
        }

        let chosen = null;
        const num = parseInt(input, 10);
        if (!isNaN(num) && num >= 1 && num <= Game.data.backgrounds.length) {
          chosen = Game.data.backgrounds[num - 1];
        } else {
          for (const bg of Game.data.backgrounds) {
            if (bg.name.toLowerCase() === input || bg.id === input) {
              chosen = bg;
              break;
            }
          }
          if (!chosen) {
            for (const bg of Game.data.backgrounds) {
              if (bg.name.toLowerCase().includes(input)) {
                chosen = bg;
                break;
              }
            }
          }
        }

        if (!chosen) {
          Game.ui.print('Please choose a valid background by number or name.', 'output-error');
          return;
        }

        this.characterDraft.backgroundId = chosen.id;
        this.currentStep = 3;
        Game.ui.print(`  You chose: ${chosen.name}`, 'output-highlight');
        this.showStep3();
      },

      handleStep3: function(input) {
        const draft = this.characterDraft;
        const parts = input.split(/\s+/);

        if (input === 'back') {
          this.currentStep = 2;
          this.showStep2();
          return;
        }

        if (input === 'continue' || input === 'next' || input === 'done') {
          if (draft.allocatedStatPoints > draft.maxStatPoints) {
            Game.ui.print('You have used more points than allowed. Lower some stats first.', 'output-error');
            return;
          }
          this.currentStep = 4;
          this.showStep4();
          return;
        }

        if (input === 'help' || input === 'help stats') {
          Game.ui.print('', '');
          Game.ui.print('Stat Allocation Help:', 'output-highlight');
          Game.ui.print('  increase <stat>    - Raise a stat by 1 (costs 1 point)', 'output-narrative');
          Game.ui.print('  decrease <stat>    - Lower a stat by 1 (refunds 1 point)', 'output-narrative');
          Game.ui.print('  set <stat> <val>   - Set a stat to a specific value', 'output-narrative');
          Game.ui.print('  continue           - Move to next step', 'output-narrative');
          Game.ui.print('  back               - Go to previous step', 'output-narrative');
          Game.ui.print('', '');
          Game.ui.print('Stats: might, agility, endurance, intellect, will, presence', 'output-system');
          Game.ui.print('', '');
          this.displayStats();
          return;
        }

        if (parts[0] === 'increase' && parts[1]) {
          return this.increaseStat(parts[1]);
        }
        if (parts[0] === 'decrease' && parts[1]) {
          return this.decreaseStat(parts[1]);
        }
        if (parts[0] === 'set' && parts[1] && parts[2]) {
          const val = parseInt(parts[2], 10);
          if (isNaN(val)) {
            Game.ui.print('Please provide a valid number.', 'output-error');
            return;
          }
          return this.setStat(parts[1], val);
        }

        Game.ui.print('Unknown command. Try "increase might", "set will 2", "continue", or "help".', 'output-error');
      },

      increaseStat: function(statName) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] >= 3) {
          Game.ui.print(`${statName} is already at the maximum of 3.`, 'output-error');
          return;
        }
        const remaining = draft.maxStatPoints - draft.allocatedStatPoints;
        if (remaining <= 0) {
          Game.ui.print('No points remaining. Lower a stat or continue.', 'output-error');
          return;
        }
        draft.baseStats[statName]++;
        draft.allocatedStatPoints++;
        Game.ui.print(`${statName} increased to ${draft.baseStats[statName]}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      decreaseStat: function(statName) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] <= -1) {
          Game.ui.print(`${statName} is already at the minimum of -1.`, 'output-error');
          return;
        }
        if (draft.baseStats[statName] === 0) {
          if (draft.sacrificedStat !== null) {
            Game.ui.print('You have already sacrificed one stat. You cannot sacrifice another.', 'output-error');
            return;
          }
        }
        const newTarget = draft.baseStats[statName] - 1;
        if (draft.baseStats[statName] === 0 && newTarget === -1) {
          draft.sacrificedStat = statName;
        }
        draft.baseStats[statName]--;
        draft.allocatedStatPoints = Math.max(0, draft.allocatedStatPoints - 1);
        Game.ui.print(`${statName} decreased to ${draft.baseStats[statName]}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      setStat: function(statName, value) {
        const draft = this.characterDraft;
        if (!STAT_NAMES.includes(statName)) {
          Game.ui.print(`Unknown stat: ${statName}. Valid stats: ${STAT_NAMES.join(', ')}`, 'output-error');
          return;
        }
        if (value > 3) {
          Game.ui.print('No stat may be set above 3.', 'output-error');
          return;
        }
        if (value < -1) {
          Game.ui.print('No stat may be set below -1.', 'output-error');
          return;
        }
        if (value === -1 && draft.sacrificedStat !== null && draft.sacrificedStat !== statName) {
          Game.ui.print('Only one stat may be lowered to -1.', 'output-error');
          return;
        }

        const oldValue = draft.baseStats[statName];
        const cost = value - oldValue;
        const newAllocated = draft.allocatedStatPoints + cost;

        if (newAllocated > draft.maxStatPoints) {
          Game.ui.print(`Cannot set ${statName} to ${value}. Not enough points.`, 'output-error');
          return;
        }
        if (newAllocated < 0) {
          Game.ui.print(`Cannot set ${statName} to ${value}.`, 'output-error');
          return;
        }

        if (value === -1) {
          draft.sacrificedStat = statName;
        } else if (oldValue === -1 && value >= 0) {
          draft.sacrificedStat = null;
        }

        draft.baseStats[statName] = value;
        draft.allocatedStatPoints = newAllocated;
        Game.ui.print(`${statName} set to ${value}. (${draft.maxStatPoints - draft.allocatedStatPoints} points remaining)`, 'output-system');
        Game.ui.print('');
        this.displayStats();
      },

      handleStep4: function(input) {
        const draft = this.characterDraft;
        const parts = input.split(/\s+/);

        if (input === 'back') {
          this.currentStep = 3;
          this.showStep3();
          return;
        }

        if (input === 'continue' || input === 'next' || input === 'done') {
          if (draft.chosenSkills.length < 4) {
            Game.ui.print(`You have trained ${draft.chosenSkills.length} of 4 skills. Train all 4 before continuing.`, 'output-error');
            return;
          }
          this.currentStep = 5;
          this.showStep5();
          return;
        }

        if (parts[0] === 'train' && parts[1]) {
          return this.trainSkill(parts.slice(1).join(' '));
        }
        if (parts[0] === 'untrain' && parts[1]) {
          return this.untrainSkill(parts.slice(1).join(' '));
        }

        Game.ui.print('Unknown command. Try "train stealth", "untrain lore", "continue", or "back".', 'output-error');
      },

      findSkillId: function(name) {
        const lower = name.toLowerCase();
        for (const skill of Game.data.skills) {
          if (skill.id === lower || skill.name.toLowerCase() === lower || skill.name.toLowerCase().includes(lower)) {
            return skill.id;
          }
        }
        return null;
      },

      getBackgroundSkillTotal: function(skillId) {
        const bg = Game.data.backgrounds.find(b => b.id === this.characterDraft.backgroundId);
        if (bg && bg.skillBonuses && bg.skillBonuses[skillId]) return bg.skillBonuses[skillId];
        return 0;
      },

      trainSkill: function(name) {
        const draft = this.characterDraft;
        const skillId = this.findSkillId(name);
        if (!skillId) {
          Game.ui.print(`Unknown skill: ${name}. Available: ${Game.data.skills.map(s => s.id).join(', ')}`, 'output-error');
          return;
        }
        if (draft.chosenSkills.includes(skillId)) {
          Game.ui.print(`${skillId} is already trained.`, 'output-error');
          return;
        }
        if (draft.chosenSkills.length >= 4) {
          Game.ui.print('You have already chosen 4 skills. Untrain one first.', 'output-error');
          return;
        }
        const bgBonus = this.getBackgroundSkillTotal(skillId);
        if (bgBonus + 1 > 3) {
          Game.ui.print(`Cannot train ${skillId}: would exceed the skill cap of 3.`, 'output-error');
          return;
        }
        draft.chosenSkills.push(skillId);
        Game.ui.print(`Trained: ${skillId} (+1). (${draft.chosenSkills.length}/4)`, 'output-system');
        Game.ui.print('');
        this.displaySkills();
      },

      untrainSkill: function(name) {
        const draft = this.characterDraft;
        const skillId = this.findSkillId(name);
        if (!skillId) {
          Game.ui.print(`Unknown skill: ${name}.`, 'output-error');
          return;
        }
        const idx = draft.chosenSkills.indexOf(skillId);
        if (idx === -1) {
          Game.ui.print(`${skillId} is not currently trained.`, 'output-error');
          return;
        }
        draft.chosenSkills.splice(idx, 1);
        Game.ui.print(`Untrained: ${skillId}. (${draft.chosenSkills.length}/4)`, 'output-system');
        Game.ui.print('');
        this.displaySkills();
      },

      handleStep5: function(input) {
        if (input === 'back') {
          this.currentStep = 4;
          this.showStep4();
          return;
        }
        if (input === 'continue' || input === 'next') {
          this.currentStep = 6;
          this.showStep6();
          return;
        }
        Game.ui.print('Type "continue" to proceed, or "back" to go to the previous step.', 'output-system');
      },

      handleStep6: function(input) {
        if (input === 'back') {
          this.currentStep = 5;
          this.showStep5();
          return;
        }
        if (input === 'confirm' || input === 'yes' || input === 'start') {
          this.currentStep = 7;
          this.showStep7();
          return;
        }
        if (input === 'restart') {
          this.start();
          return;
        }
        Game.ui.print('Type "confirm" to begin, "restart" to start over, or "back".', 'output-system');
      },

      handleInput: function(input) {
        switch (this.currentStep) {
          case 1: this.handleStep1(input); break;
          case 2: this.handleStep2(input); break;
          case 3: this.handleStep3(input); break;
          case 4: this.handleStep4(input); break;
          case 5: this.handleStep5(input); break;
          case 6: this.handleStep6(input); break;
        }
      }
    };

    Game.clock.init = function() {
      Game.state.clock = {
        day: 1,
        hour: 8,
        minute: 0,
        month: 'Frostwane'
      };
    };

    Game.clock.months = ['Frostwane', 'Emberwane', 'Thornwane', 'Bloomwane', 'Sunwane', 'Harvestwane', 'Stormwane', 'Ashwane'];
    Game.clock.daysPerMonth = 30;

    Game.clock.advanceTime = function(minutes) {
      if (!minutes || minutes <= 0) return [];
      const clock = Game.state.clock;
      const prevPhase = Game.clock.getDayPhase();
      clock.minute += minutes;
      while (clock.minute >= 60) {
        clock.minute -= 60;
        clock.hour++;
      }
      while (clock.hour >= 24) {
        clock.hour -= 24;
        clock.day++;
      }
      if (clock.day > Game.clock.daysPerMonth) {
        clock.day = 1;
        const monthIdx = Game.clock.months.indexOf(clock.month);
        clock.month = Game.clock.months[(monthIdx + 1) % Game.clock.months.length];
      }
      if (typeof Game.clock.tickConditions === 'function') {
        Game.clock.tickConditions(minutes);
      }
      const newPhase = Game.clock.getDayPhase();
      if (newPhase !== prevPhase) {
        Game.ui.print('[ ' + newPhase + ' ]', 'output-system');
      }
      let scheduleMessages = [];
      if (Game.schedules && typeof Game.schedules.update === 'function') {
        scheduleMessages = Game.schedules.update();
      }
      return scheduleMessages;
    };

    Game.clock.getDayPhase = function() {
      const hour = Game.state.clock.hour;
      if (hour >= 5 && hour <= 7) return 'Dawn';
      if (hour >= 8 && hour <= 11) return 'Morning';
      if (hour >= 12 && hour <= 13) return 'Midday';
      if (hour >= 14 && hour <= 16) return 'Afternoon';
      if (hour >= 17 && hour <= 18) return 'Late afternoon';
      if (hour >= 19 && hour <= 20) return 'Evening';
      if (hour >= 21 && hour <= 23) return 'Night';
      return 'Deep night';
    };

    Game.clock.getOrdinalDay = function() {
      const ordinals = ['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth',
        'eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth',
        'twenty-first','twenty-second','twenty-third','twenty-fourth','twenty-fifth','twenty-sixth','twenty-seventh','twenty-eighth','twenty-ninth','thirtieth'];
      const day = Game.state.clock.day;
      if (day >= 1 && day <= 30) return ordinals[day];
      return day + 'th';
    };

    Game.clock.formatTime = function() {
      const phase = this.getDayPhase();
      const ordinal = this.getOrdinalDay();
      const month = Game.state.clock.month;
      return `${phase}, ${ordinal} day of ${month}`;
    };

    Game.clock.tickConditions = function(minutes) {
      const player = Game.state.player;
      if (!player) return;
      const expired = Game.conditions.updateConditions(player, minutes);
      for (const cond of expired) {
        const condData = Game.data.conditions.find(c => c.id === cond.id);
        const name = condData ? condData.name : cond.id;
        Game.ui.print(`[ ${name} has worn off ]`, 'output-system');
      }
    };

    Game.inventory.init = function() {
      Game.state.inventory = [];
      Game.state.equipment = {
        weapon: null,
        offhand: null,
        armor: null,
        cloak: null,
        accessory1: null,
        accessory2: null
      };
    };

    Game.inventory.addItem = function(itemId, quantity) {
      quantity = quantity || 1;
      const item = Game.data.items[itemId];
      if (!item) return false;
      
      const inv = Game.state.player.inventory;
      if (item.stackable) {
        const existing = inv.find(e => e.itemId === itemId);
        if (existing) {
          existing.quantity += quantity;
          return true;
        }
      }
      
      inv.push({ itemId: itemId, quantity: quantity });
      return true;
    };

    Game.inventory.removeItem = function(itemId, quantity) {
      quantity = quantity || 1;
      const inv = Game.state.player.inventory;
      const entry = inv.find(e => e.itemId === itemId);
      if (!entry) return false;
      
      entry.quantity -= quantity;
      if (entry.quantity <= 0) {
        const idx = inv.indexOf(entry);
        inv.splice(idx, 1);
      }
      return true;
    };

    Game.inventory.hasItem = function(itemId) {
      return Game.state.player.inventory.some(e => e.itemId === itemId);
    };

    Game.inventory.getItemCount = function(itemId) {
      const entry = Game.state.player.inventory.find(e => e.itemId === itemId);
      return entry ? entry.quantity : 0;
    };

    Game.inventory.getCarriedWeight = function() {
      const player = Game.state.player;
      let weight = 0;
      
      for (const entry of player.inventory) {
        const item = Game.data.items[entry.itemId];
        if (item) weight += (item.weight || 0) * entry.quantity;
      }
      
      for (const [slot, itemId] of Object.entries(player.equipment)) {
        if (itemId) {
          const item = Game.data.items[itemId];
          if (item) weight += (item.weight || 0);
        }
      }
      
      return weight;
    };

    Game.inventory.getCarryCapacity = function() {
      const player = Game.state.player;
      return 50 + 10 * (player.stats.might || 0) + 5 * (player.stats.endurance || 0);
    };

    Game.inventory.getEncumbranceTier = function() {
      const weight = this.getCarriedWeight();
      const capacity = this.getCarryCapacity();
      const percent = (weight / capacity) * 100;
      
      if (percent <= 100) return { tier: 'unencumbered', penalties: {} };
      if (percent <= 125) return { tier: 'burdened', penalties: { stealth: -1, agility: -1 } };
      if (percent <= 150) return { tier: 'encumbered', penalties: { stealth: -2, agility: -2, travelMultiplier: 1.5 } };
      return { tier: 'overloaded', penalties: { cannotTravel: true } };
    };

    Game.combat.init = function() {
      Game.state.inCombat = false;
      Game.state.currentEnemy = null;
    };

    Game.combat.startCombat = function(monster) {
      Game.state.inCombat = true;
      Game.state.currentEnemy = monster.id;
      this.getMonsterState(monster);
      Game.ui.print('', '');
      Game.ui.print('━━━━━━━━━━ COMBAT ━━━━━━━━━━', 'output-error');
      Game.ui.print('A ' + monster.name + ' attacks!', 'output-error');
      Game.ui.print('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'output-error');
      Game.ui.print('', '');
    };

    Game.combat.getMonsterState = function(monster) {
      if (!Game.state.world.monsterStates[monster.id]) {
        Game.state.world.monsterStates[monster.id] = {
          hp: monster.resources.hp,
          maxHp: monster.resources.maxHp,
          defeated: false,
          behaviorState: 'hostile',
          locationOverride: monster.defaultLocation
        };
      }
      return Game.state.world.monsterStates[monster.id];
    };

    Game.combat.calculatePlayerDefense = function() {
      const player = Game.state.player;
      let defense = 10 + (player.stats.agility || 0) + (player.skills.defense || 0);
      defense += Game.conditions.getModifierForStat(player, 'agility');
      if (player.equipment.armor) {
        const armor = Game.data.items[player.equipment.armor];
        if (armor && armor.defenseBonus) defense += armor.defenseBonus;
      }
      if (player.equipment.offhand) {
        const offhand = Game.data.items[player.equipment.offhand];
        if (offhand && offhand.shieldBonus) defense += offhand.shieldBonus;
      }
      if (player.equipment.cloak) {
        const cloak = Game.data.items[player.equipment.cloak];
        if (cloak && cloak.defenseBonus) defense += cloak.defenseBonus;
      }
      return defense;
    };

    Game.combat.getPlayerAttackStat = function() {
      const player = Game.state.player;
      const weapon = player.equipment.weapon ? Game.data.items[player.equipment.weapon] : null;
      if (weapon && weapon.stat) return weapon.stat;
      return 'might';
    };

    Game.combat.getPlayerAttackSkill = function() {
      const player = Game.state.player;
      const weapon = player.equipment.weapon ? Game.data.items[player.equipment.weapon] : null;
      if (weapon && weapon.skill) return weapon.skill;
      return 'melee';
    };

    Game.combat.getPlayerWeaponDamage = function() {
      const player = Game.state.player;
      const weapon = player.equipment.weapon ? Game.data.items[player.equipment.weapon] : null;
      if (weapon && weapon.damage) return weapon.damage;
      return '1d4';
    };

    Game.combat.getPlayerWeaponBonus = function() {
      const player = Game.state.player;
      const weapon = player.equipment.weapon ? Game.data.items[player.equipment.weapon] : null;
      if (weapon && weapon.attackBonus) return weapon.attackBonus;
      return 0;
    };

    Game.combat.attack = function(targetName) {
      const player = Game.state.player;
      if (!targetName) {
        const present = Game.schedules.getPresentMonsters(player.location);
        if (present.length === 0) {
          Game.ui.print('There is nothing to attack here.', 'output-error');
          return;
        }
        if (present.length === 1) {
          this.performAttack(present[0].monster);
          return;
        }
        Game.ui.print('Attack whom? You see: ' + present.map(e => e.monster.name).join(', '), 'output-error');
        return;
      }
      const monster = Game.schedules.findMonsterByName(targetName);
      if (!monster) {
        Game.ui.print('You don\'t see "' + targetName + '" to attack.', 'output-error');
        return;
      }
      const present = Game.schedules.isMonsterPresent(monster, player.location);
      if (!present) {
        Game.ui.print(monster.name + ' is not here.', 'output-error');
        return;
      }
      this.performAttack(monster);
    };

    Game.combat.performAttack = function(monster) {
      const player = Game.state.player;
      const mState = this.getMonsterState(monster);
      if (!Game.state.inCombat) {
        this.startCombat(monster);
      }
      const attackStat = this.getPlayerAttackStat();
      const attackSkill = this.getPlayerAttackSkill();
      const weaponBonus = this.getPlayerWeaponBonus();
      const targetDefense = monster.defense || (10 + (monster.stats.agility || 0) + (monster.skills.defense || 0));
      const die = Math.floor(Math.random() * 20) + 1;
      const statVal = (player.stats[attackStat] || 0) + Game.conditions.getModifierForStat(player, attackStat);
      const skillVal = (player.skills[attackSkill] || 0) + Game.conditions.getModifierForStat(player, attackSkill);
      const attackTotal = die + statVal + skillVal + weaponBonus;
      const weapon = player.equipment.weapon ? Game.data.items[player.equipment.weapon] : null;
      const weaponName = weapon ? weapon.name : 'bare fists';
      Game.ui.print('', '');
      if (die === 20) {
        const damage = this.rollDamage(this.getPlayerWeaponDamage(), statVal);
        mState.hp -= damage.total;
        Game.ui.print('Critical hit! Your ' + weaponName + ' strikes true, dealing ' + damage.total + ' damage!', 'output-highlight');
        if (mState.hp <= 0) {
          this.monsterDefeated(monster);
          return;
        }
      } else if (die === 1) {
        Game.ui.print('Critical miss! Your ' + weaponName + ' swings wide and you stumble.', 'output-error');
      } else if (attackTotal >= targetDefense) {
        const margin = attackTotal - targetDefense;
        const damage = this.rollDamage(this.getPlayerWeaponDamage(), statVal);
        mState.hp -= damage.total;
        let prose;
        if (margin >= 10) {
          prose = 'You devastatingly strike the ' + monster.name + ' with your ' + weaponName + ' for ' + damage.total + ' damage!';
        } else if (margin >= 5) {
          prose = 'You land a solid hit on the ' + monster.name + ' with your ' + weaponName + ' for ' + damage.total + ' damage.';
        } else {
          prose = 'Your ' + weaponName + ' grazes the ' + monster.name + ' for ' + damage.total + ' damage.';
        }
        Game.ui.print(prose, 'output-narrative');
        if (mState.hp <= 0) {
          this.monsterDefeated(monster);
          return;
        }
      } else {
        const missMargin = targetDefense - attackTotal;
        let prose;
        if (missMargin >= 10) {
          prose = 'The ' + monster.name + ' completely evades your ' + weaponName + '.';
        } else if (missMargin >= 5) {
          prose = 'The ' + monster.name + ' dodges your ' + weaponName + '.';
        } else {
          prose = 'Your ' + weaponName + ' barely misses the ' + monster.name + '.';
        }
        Game.ui.print(prose, 'output-narrative');
      }
      Game.ui.print('  [' + monster.name + ' HP: ' + mState.hp + '/' + mState.maxHp + ']', 'output-system');
      this.checkMorale(monster);
      if (mState.behaviorState === 'fleeing' || mState.behaviorState === 'surrendering') {
        return;
      }
      this.monsterTurn(monster);
      Game.clock.advanceTime(1);
    };

    Game.combat.rollDamage = function(diceExpr, statMod) {
      const result = Game.checks.rollDice(diceExpr);
      const total = Math.max(0, result.total + (statMod || 0));
      return { total: total, rolls: result.rolls };
    };

    Game.combat.monsterTurn = function(monster) {
      const player = Game.state.player;
      const mState = this.getMonsterState(monster);
      if (mState.hp <= 0) return;
      const attack = monster.attacks && monster.attacks.length > 0 ? monster.attacks[0] : null;
      const monsterStat = attack ? (attack.stat || 'might') : 'might';
      const monsterSkill = attack ? (attack.skill || 'melee') : 'melee';
      const damageExpr = attack ? attack.damage : '1d4';
      const statVal = monster.stats[monsterStat] || 0;
      const skillVal = monster.skills[monsterSkill] || 0;
      const playerDefense = this.calculatePlayerDefense();
      const die = Math.floor(Math.random() * 20) + 1;
      const attackTotal = die + statVal + skillVal;
      if (die === 20) {
        const damage = this.rollDamage(damageExpr, statVal);
        player.resources.hp -= damage.total;
        Game.ui.print('The ' + monster.name + ' lands a devastating blow for ' + damage.total + ' damage!', 'output-error');
      } else if (die === 1) {
        Game.ui.print('The ' + monster.name + ' fumbles its attack!', 'output-narrative');
      } else if (attackTotal >= playerDefense) {
        const damage = this.rollDamage(damageExpr, statVal);
        player.resources.hp -= damage.total;
        const margin = attackTotal - playerDefense;
        let prose;
        if (margin >= 10) {
          prose = 'The ' + monster.name + ' strikes you hard for ' + damage.total + ' damage!';
        } else if (margin >= 5) {
          prose = 'The ' + monster.name + ' hits you for ' + damage.total + ' damage.';
        } else {
          prose = 'The ' + monster.name + ' barely nicks you for ' + damage.total + ' damage.';
        }
        Game.ui.print(prose, 'output-error');
      } else {
        const missMargin = playerDefense - attackTotal;
        let prose;
        if (missMargin >= 10) {
          prose = 'You easily dodge the ' + monster.name + '\'s attack.';
        } else if (missMargin >= 5) {
          prose = 'You dodge the ' + monster.name + '\'s attack.';
        } else {
          prose = 'The ' + monster.name + '\'s attack barely misses you.';
        }
        Game.ui.print(prose, 'output-narrative');
      }
      Game.ui.print('  [Your HP: ' + player.resources.hp + '/' + player.resources.maxHp + ']', 'output-system');
      if (player.resources.hp <= 0) {
        this.playerDefeated();
      }
    };

    Game.combat.checkMorale = function(monster) {
      const mState = this.getMonsterState(monster);
      const behavior = monster.behavior || {};
      const morale = behavior.morale || 10;
      const fleesAtHpPercent = behavior.fleesAtHpPercent || 25;
      const hpPercent = (mState.hp / mState.maxHp) * 100;
      let shouldCheck = false;
      let difficulty = 0;
      if (hpPercent <= fleesAtHpPercent) {
        shouldCheck = true;
        difficulty = 15;
      } else if (hpPercent <= 50) {
        shouldCheck = true;
        difficulty = 10;
      }
      if (!shouldCheck) return;
      const willStat = monster.stats.will || 0;
      const die = Math.floor(Math.random() * 20) + 1;
      const total = die + willStat;
      if (total < difficulty + morale) {
        if (hpPercent <= 10) {
          mState.behaviorState = 'surrendering';
          Game.ui.print('', '');
          Game.ui.print('The ' + monster.name + ' drops to its knees and surrenders!', 'output-highlight');
        } else {
          mState.behaviorState = 'fleeing';
          Game.ui.print('', '');
          Game.ui.print('The ' + monster.name + ' turns and flees!', 'output-highlight');
          mState.defeated = true;
          this.generateLoot(monster);
          Game.state.inCombat = false;
          Game.state.currentEnemy = null;
        }
      }
    };

    Game.combat.monsterDefeated = function(monster) {
      const mState = this.getMonsterState(monster);
      mState.hp = 0;
      mState.defeated = true;
      mState.behaviorState = 'defeated';
      Game.ui.print('', '');
      Game.ui.print('The ' + monster.name + ' is defeated!', 'output-highlight');
      this.generateLoot(monster);
      const xpGain = Math.max(1, Math.floor(monster.resources.maxHp / 2));
      Game.state.player.xp = (Game.state.player.xp || 0) + xpGain;
      Game.ui.print('You gain ' + xpGain + ' XP.', 'output-system');
      Game.state.inCombat = false;
      Game.state.currentEnemy = null;
      Game.ui.print('', '');
      Game.ui.print('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'output-highlight');
      Game.ui.print('', '');
    };

    Game.combat.generateLoot = function(monster) {
      if (!monster.loot || monster.loot.length === 0) return;
      const droppedItems = [];
      for (const entry of monster.loot) {
        const roll = Math.floor(Math.random() * 100) + 1;
        if (roll <= entry.chance) {
          const qty = entry.quantity ? Game.checks.rollDice(entry.quantity.toString()).total : 1;
          Game.inventory.addItem(entry.itemId, qty);
          const itemData = Game.data.items[entry.itemId];
          const name = itemData ? itemData.name : entry.itemId;
          const qtyText = qty > 1 ? ' x' + qty : '';
          droppedItems.push(name + qtyText);
        }
      }
      if (droppedItems.length > 0) {
        Game.ui.print('Loot: ' + droppedItems.join(', '), 'output-highlight');
      }
    };

    Game.combat.playerDefeated = function() {
      Game.state.player.resources.hp = 0;
      Game.state.inCombat = false;
      Game.state.currentEnemy = null;
      Game.ui.print('', '');
      Game.ui.print('══════════════════════════════════════', 'separator');
      Game.ui.print('', '');
      Game.ui.print('  You have fallen...', 'output-error');
      Game.ui.print('', '');
      Game.ui.print('  Darkness claims you. Your adventure ends here.', 'output-narrative');
      Game.ui.print('', '');
      Game.ui.print('══════════════════════════════════════', 'separator');
      Game.ui.print('', '');
      Game.ui.print('Type "restart" for a new game or "quit" to exit.', 'output-system');
      Game.state.mode = GameModes.GAME_OVER;
    };

    Game.combat.endCombat = function() {
      Game.state.inCombat = false;
      Game.state.currentEnemy = null;
    };

    Game.conditions.init = function() {
    };

    Game.conditions.addCondition = function(actor, conditionId, severity, remainingMinutes) {
      if (!actor.conditions) actor.conditions = [];
      const existing = actor.conditions.find(c => c.id === conditionId);
      if (existing) {
        if ((severity || 1) > existing.severity) existing.severity = severity || 1;
        if ((remainingMinutes || 60) > existing.remainingMinutes) existing.remainingMinutes = remainingMinutes || 60;
        return;
      }
      actor.conditions.push({ id: conditionId, severity: severity || 1, remainingMinutes: remainingMinutes || 60 });
    };

    Game.conditions.removeCondition = function(actor, conditionId) {
      if (!actor.conditions) return;
      const idx = actor.conditions.findIndex(c => c.id === conditionId);
      if (idx !== -1) actor.conditions.splice(idx, 1);
    };

    Game.conditions.hasCondition = function(actor, conditionId) {
      if (!actor.conditions) return false;
      return actor.conditions.some(c => c.id === conditionId);
    };

    Game.conditions.updateConditions = function(actor, minutes) {
      if (!actor.conditions || actor.conditions.length === 0) return [];
      const expired = [];
      for (let i = actor.conditions.length - 1; i >= 0; i--) {
        const cond = actor.conditions[i];
        if (cond.remainingMinutes > 0) {
          cond.remainingMinutes -= minutes;
          if (cond.remainingMinutes <= 0) {
            expired.push(actor.conditions.splice(i, 1)[0]);
          }
        }
      }
      return expired;
    };

    Game.conditions.getModifierForStat = function(actor, stat) {
      if (!actor || !actor.conditions || actor.conditions.length === 0) return 0;
      let total = 0;
      for (const cond of actor.conditions) {
        const condData = Game.data.conditions.find(c => c.id === cond.id);
        if (condData && condData.modifiers && condData.modifiers[stat] !== undefined) {
          total += condData.modifiers[stat];
        }
      }
      return total;
    };

    Game.checks.rollDice = function(expression) {
      if (!expression) return { total: 0, rolls: [], modifier: 0, expression: '' };
      const expr = expression.toString().trim().toLowerCase();
      const match = expr.match(/^(\d+)d(\d+)([+-]\d+)?$/);
      if (!match) {
        const num = parseInt(expr, 10);
        if (!isNaN(num)) return { total: num, rolls: [num], modifier: 0, expression: expr };
        return { total: 0, rolls: [], modifier: 0, expression: expr };
      }
      const numDice = parseInt(match[1], 10);
      const numSides = parseInt(match[2], 10);
      const modifier = match[3] ? parseInt(match[3], 10) : 0;
      const rolls = [];
      for (let i = 0; i < numDice; i++) {
        rolls.push(Math.floor(Math.random() * numSides) + 1);
      }
      const sum = rolls.reduce((a, b) => a + b, 0);
      return { total: sum + modifier, rolls: rolls, modifier: modifier, expression: expr };
    };

    Game.checks.rollCheck = function(player, stat, skill, difficulty) {
      const die = Math.floor(Math.random() * 20) + 1;
      const statVal = (player.stats && player.stats[stat]) || 0;
      const skillVal = (player.skills && player.skills[skill]) || 0;
      const condMods = this.getConditionModifiers(player);
      const bonusTotal = statVal + skillVal + condMods.total;
      const total = die + bonusTotal;
      const margin = total - difficulty;
      let degree;
      if (die === 20) {
        degree = 'critical_success';
      } else if (die === 1) {
        degree = 'critical_failure';
      } else if (margin >= 5) {
        degree = 'strong_success';
      } else if (margin >= 0) {
        degree = 'success';
      } else if (margin > -5) {
        degree = 'failure';
      } else {
        degree = 'bad_failure';
      }
      if (Game.checks.debugMode) {
        let d = '[DEBUG] d20(' + die + ') + ' + stat + '(' + statVal + ') + ' + skill + '(' + skillVal + ')';
        if (condMods.total !== 0) d += ' + cond(' + condMods.total + ')';
        d += ' = ' + total + ' vs ' + difficulty + ' [' + degree + ']';
        Game.ui.print(d, 'output-system');
      }
      return { die: die, stat: stat, statValue: statVal, skill: skill, skillValue: skillVal, conditionModifiers: condMods.details, difficulty: difficulty, total: total, margin: margin, degree: degree };
    };

    Game.checks.getConditionModifiers = function(actor) {
      if (!actor || !actor.conditions || actor.conditions.length === 0) {
        return { total: 0, details: [] };
      }
      let total = 0;
      const details = [];
      for (const cond of actor.conditions) {
        const condData = Game.data.conditions.find(c => c.id === cond.id);
        if (condData && condData.modifiers) {
          for (const [k, v] of Object.entries(condData.modifiers)) {
            total += v;
            details.push({ condition: cond.id, stat: k, value: v });
          }
        }
      }
      return { total: total, details: details };
    };

    Game.checks.getProse = function(degree) {
      const map = {
        critical_success: 'an extraordinary success',
        strong_success: 'a clear success',
        success: 'a narrow success',
        failure: 'a failure',
        bad_failure: 'a disastrous failure',
        critical_failure: 'a catastrophic failure'
      };
      return map[degree] || 'an uncertain outcome';
    };

    Game.checks.getDifficulty = function(name) {
      const lower = name.toString().toLowerCase().trim();
      if (Game.data.difficulties[lower] !== undefined) return Game.data.difficulties[lower];
      const num = parseInt(lower, 10);
      if (!isNaN(num)) return num;
      return Game.data.difficulties.moderate;
    };

    Game.storage.init = function() {
      Game.state.saveSlots = 3;
    };


    Game.schedules = {};

    Game.schedules.isTimeInRange = function(current, start, end) {
      if (start <= end) {
        return current >= start && current < end;
      }
      return current >= start || current < end;
    };

    Game.schedules.getSchedule = function(scheduleId) {
      if (!scheduleId) return null;
      return Game.data.schedules.find(s => s.id === scheduleId) || null;
    };

    Game.schedules.getCurrentMinutes = function(clock) {
      return clock.hour * 60 + clock.minute;
    };

    Game.schedules.getScheduledLocation = function(entity, clock) {
      if (!entity || !entity.scheduleId) return entity ? entity.defaultLocation : null;
      const schedule = this.getSchedule(entity.scheduleId);
      if (!schedule) return entity.defaultLocation;
      const current = this.getCurrentMinutes(clock);
      const entry = schedule.entries.find(e => this.isTimeInRange(current, e.start, e.end));
      if (!entry) return entity.defaultLocation;
      return entry.location;
    };

    Game.schedules.getActivity = function(entity, clock) {
      if (!entity || !entity.scheduleId) return null;
      const schedule = this.getSchedule(entity.scheduleId);
      if (!schedule) return null;
      const current = this.getCurrentMinutes(clock);
      const entry = schedule.entries.find(e => this.isTimeInRange(current, e.start, e.end));
      return entry ? entry.activity : null;
    };

    Game.schedules.resolveNPCLocation = function(npc) {
      const override = Game.state.world.npcOverrides[npc.id];
      if (override) return override.location;
      return this.getScheduledLocation(npc, Game.state.clock);
    };

    Game.schedules.resolveMonsterLocation = function(monster) {
      const mState = Game.state.world.monsterStates[monster.id];
      if (mState && mState.locationOverride) return mState.locationOverride;
      return this.getScheduledLocation(monster, Game.state.clock);
    };

    Game.schedules.getPresentNPCs = function(locationId) {
      const result = [];
      for (const npc of Game.data.npcs) {
        const loc = this.resolveNPCLocation(npc);
        if (loc === locationId) {
          const activity = this.getActivity(npc, Game.state.clock);
          result.push({ npc, activity });
        }
      }
      return result;
    };

    Game.schedules.getPresentMonsters = function(locationId) {
      const result = [];
      for (const monster of Game.data.monsters) {
        const mState = Game.state.world.monsterStates[monster.id];
        if (mState && mState.defeated) continue;
        const loc = this.resolveMonsterLocation(monster);
        if (loc === locationId) {
          const activity = this.getActivity(monster, Game.state.clock);
          result.push({ monster, activity });
        }
      }
      return result;
    };

    Game.schedules.isNPCPresent = function(npc, locationId) {
      const loc = this.resolveNPCLocation(npc);
      return loc === locationId;
    };

    Game.schedules.isMonsterPresent = function(monster, locationId) {
      const mState = Game.state.world.monsterStates[monster.id];
      if (mState && mState.defeated) return false;
      const loc = this.resolveMonsterLocation(monster);
      return loc === locationId;
    };

    Game.schedules.findNPCByName = function(name) {
      for (const npc of Game.data.npcs) {
        if (npc.name.toLowerCase() === name ||
            npc.id === name ||
            (npc.aliases && npc.aliases.includes(name))) {
          return npc;
        }
      }
      for (const npc of Game.data.npcs) {
        if (npc.name.toLowerCase().includes(name)) return npc;
      }
      return null;
    };

    Game.schedules.findMonsterByName = function(name) {
      for (const monster of Game.data.monsters) {
        if (monster.name.toLowerCase() === name ||
            monster.id === name ||
            (monster.aliases && monster.aliases.includes(name))) {
          return monster;
        }
      }
      for (const monster of Game.data.monsters) {
        if (monster.name.toLowerCase().includes(name)) return monster;
      }
      return null;
    };

    Game.schedules.init = function() {
      Game.state.npcLocations = {};
      Game.state.monsterLocations = {};
      for (const npc of Game.data.npcs) {
        Game.state.npcLocations[npc.id] = this.resolveNPCLocation(npc);
      }
      for (const monster of Game.data.monsters) {
        Game.state.monsterLocations[monster.id] = this.resolveMonsterLocation(monster);
      }
    };

    Game.schedules.update = function() {
      const messages = [];
      for (const npc of Game.data.npcs) {
        const newLoc = this.resolveNPCLocation(npc);
        const oldLoc = Game.state.npcLocations[npc.id];
        if (newLoc !== oldLoc) {
          Game.state.npcLocations[npc.id] = newLoc;
          const playerLoc = Game.state.player ? Game.state.player.location : null;
          if (oldLoc === playerLoc) {
            const locData = Game.data.locations[oldLoc];
            messages.push(npc.name + ' leaves' + (locData ? ' (' + locData.name + ')' : '') + '.');
          }
          if (newLoc === playerLoc) {
            const locData = Game.data.locations[newLoc];
            const activity = this.getActivity(npc, Game.state.clock);
            let msg = npc.name + ' arrives' + (locData ? ' at ' + locData.name : '');
            if (activity) msg += ', ' + activity;
            messages.push(msg + '.');
          }
        }
      }
      for (const monster of Game.data.monsters) {
        const mState = Game.state.world.monsterStates[monster.id];
        if (mState && mState.defeated) continue;
        const newLoc = this.resolveMonsterLocation(monster);
        const oldLoc = Game.state.monsterLocations[monster.id];
        if (newLoc !== oldLoc) {
          Game.state.monsterLocations[monster.id] = newLoc;
        }
      }
      return messages;
    };

    Game.state.player = null;
    Game.state.flags = {};
    Game.state.variables = {};
    Game.state.world = {
      itemLocations: {},
      npcOverrides: {},
      monsterStates: {},
      locationStates: {}
    };

    Game.init = function() {
      this.clock.init();
      this.inventory.init();
      this.combat.init();
      this.conditions.init();
      this.storage.init();
      this.schedules.init();
      
      Game.ui.showTitle();
      Game.ui.print('', '');
    };

    const commandInput = document.getElementById('command-input');
    
    commandInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const value = this.value;
        this.value = '';
        Game.ui.handleInput(value);
      }
    });

    commandInput.addEventListener('focus', function() {
      document.querySelector('.cursor').style.display = 'none';
    });

    commandInput.addEventListener('blur', function() {
      document.querySelector('.cursor').style.display = 'inline-block';
      this.focus();
    });

    setTimeout(() => commandInput.focus(), 100);
    Game.init();
  </script>
</body>
</html>
